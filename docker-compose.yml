version: "3.9"

# =============================================================================
# EduVision AI — Full-stack orchestration
# =============================================================================
# Usage:
#   docker compose up -d              # start everything
#   docker compose up -d --build      # rebuild images then start
#   docker compose logs -f backend    # tail backend logs
#   docker compose down -v            # stop and remove volumes
#
# Environment variables are loaded from .env (copy .env.example -> .env).
# =============================================================================

x-common-env: &common-env
  APP_ENV: ${APP_ENV:-development}
  APP_DEBUG: ${APP_DEBUG:-true}
  APP_SECRET_KEY: ${APP_SECRET_KEY:-CHANGE-ME-TO-A-RANDOM-SECRET-KEY-32CHARS}
  DATABASE_URL: postgresql+asyncpg://eduvision:eduvision@postgres:5432/eduvision
  DATABASE_SYNC_URL: postgresql://eduvision:eduvision@postgres:5432/eduvision
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2
  S3_ENDPOINT_URL: http://minio:9000
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minioadmin}
  AI_PROVIDER: ${AI_PROVIDER:-local}
  AI_API_KEY: ${AI_API_KEY:-}
  AI_MODEL: ${AI_MODEL:-gemini-3.5-flash}
  CSRF_SECRET: ${CSRF_SECRET:-CHANGE-ME-CSRF-SECRET}
  COOKIE_SECURE: "false"

services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: eduvision
      POSTGRES_PASSWORD: eduvision
      POSTGRES_DB: eduvision
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eduvision -d eduvision"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis (single instance, 3 databases for cache / broker / results) ──────
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MinIO (S3-compatible object storage) ───────────────────────────────────
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend (FastAPI + Uvicorn) ────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      <<: *common-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - upload_data:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── Celery Worker ──────────────────────────────────────────────────────────
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    restart: unless-stopped
    command: celery -A app.workers.celery_app worker -l info -c ${CELERY_WORKER_CONCURRENCY:-4}
    env_file:
      - .env
    environment:
      <<: *common-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - upload_data:/app/uploads

  # ── Celery Beat (periodic task scheduler) ──────────────────────────────────
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    restart: unless-stopped
    command: celery -A app.workers.celery_app beat -l info
    env_file:
      - .env
    environment:
      <<: *common-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      - ./backend:/app

volumes:
  postgres_data:
  redis_data:
  minio_data:
  upload_data:
