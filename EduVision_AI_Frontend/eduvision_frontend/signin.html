<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sign in — EduVision AI</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<link href="assets/style.css" rel="stylesheet">
<style>
body{min-height:100vh;display:flex;flex-direction:column}
.wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:3rem 1rem}
.auth-card{width:100%;max-width:420px;padding:2.5rem 2.25rem}
.divider{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.78rem;margin:1.4rem 0}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
</style>
</head>
<body>

<nav class="navbar py-3">
  <div class="container d-flex justify-content-between align-items-center">
    <a href="index.html" style="text-decoration:none;color:inherit;" class="d-flex align-items-center gap-2">
      <div class="brand-mark">EV</div>
      <span class="display-font fw-bold" style="font-size:1.05rem;">EduVision AI</span>
    </a>
    <span class="hint">No account? <a href="signup.html" class="link-amber">Sign up</a></span>
  </div>
</nav>

<div class="wrap">
  <div class="auth-card frame card-in">
    <div class="corner corner-tl"></div><div class="corner corner-br"></div>
    <div class="eyebrow mb-2">Welcome back</div>
    <h1 class="mb-1" style="font-size:1.8rem;">Sign in</h1>
    <p class="hint mb-4">One idea, seen clearly. Pick up where you left off.</p>

    <form onsubmit="event.preventDefault(); window.location.href='upload.html';">
      <div class="mb-3 field" style="animation-delay:.05s">
        <label class="form-label mb-1">Email</label>
        <input type="email" class="form-control" placeholder="you@example.com">
      </div>
      <div class="mb-2 field" style="animation-delay:.15s">
        <label class="form-label mb-1">Password</label>
        <input type="password" class="form-control" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;">
      </div>
      <div class="d-flex justify-content-between align-items-center mb-4 field" style="animation-delay:.22s">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="remember" style="background:transparent;border-color:var(--line);">
          <label class="form-check-label hint" for="remember">Remember me</label>
        </div>
        <a href="#" class="hint link-amber" style="font-weight:400;">Forgot password?</a>
      </div>
      <div class="field" style="animation-delay:.3s">
        <button type="submit" class="btn-signal w-100">Sign in &rarr;</button>
      </div>
    </form>


  </div>
</div>

<footer style="text-align:center;">EduVision AI &mdash; no roles, no course structure, just the idea, seen clearly.</footer>
<script src="assets/app.js"></script>
</body>
</html>
