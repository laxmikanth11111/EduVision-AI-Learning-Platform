<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Present — EduVision AI</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
    --ink: #0E1A2B;
    --paper: #F4EFE4;
    --amber: #F2A623;
    --teal: #1D9E75;
    --coral: #D85A30;
    --line: rgba(244,239,228,0.14);
    --muted: rgba(244,239,228,0.55);
    --muted-strong: rgba(244,239,228,0.72);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { background: var(--ink); color: var(--paper); font-family: 'Manrope', sans-serif; display: flex; flex-direction: column; overflow: hidden; }
h1, h2, h3 { font-family: 'Space Grotesk', sans-serif; }
button { font-family: 'Space Grotesk', sans-serif; }

/* ── Header ─────────────────────────────────────── */
header { display: flex; align-items: center; justify-content: space-between; padding: .65rem 1.25rem; border-bottom: 1px solid var(--line); flex-shrink: 0; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: inherit; }
.brand-mark { width: 32px; height: 32px; border-radius: 8px; background: var(--amber); display: flex; align-items: center; justify-content: center; font-weight: 700; color: var(--ink); font-family: 'Space Grotesk', sans-serif; }
.brand-name { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 1rem; }
.deck-title { font-size: .82rem; color: var(--muted); max-width: 40vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.btn-present { background: var(--amber); color: var(--ink); border: none; font-weight: 700; padding: .55rem 1.3rem; border-radius: 2px; cursor: pointer; font-size: .9rem; transition: transform .15s, background .15s; }
.btn-present:hover { background: #ffbf47; }
.btn-present:active { transform: scale(.96); }

/* ── Main layout ────────────────────────────────── */
.main { flex: 1; display: flex; min-height: 0; }

/* Sidebar */
.sidebar { width: 230px; flex-shrink: 0; border-right: 1px solid var(--line); overflow-y: auto; padding: .75rem; scrollbar-width: thin; scrollbar-color: rgba(244,239,228,.2) transparent; }
.sidebar::-webkit-scrollbar { width: 6px; }
.sidebar::-webkit-scrollbar-thumb { background: rgba(244,239,228,.18); border-radius: 3px; }
.thumb { border: 1px solid var(--line); border-radius: 3px; padding: .55rem .7rem; margin-bottom: .45rem; cursor: pointer; transition: border-color .15s, background .15s; position: relative; }
.thumb:hover { border-color: var(--muted); }
.thumb.active { border-color: var(--amber); background: rgba(242,166,35,0.07); }
.thumb-num { font-family: 'Space Grotesk', sans-serif; font-size: .68rem; color: var(--amber); letter-spacing: .08em; }
.thumb-kind { font-size: .62rem; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; float: right; }
.thumb-title { font-size: .8rem; color: var(--muted-strong); margin-top: .2rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.thumb.active .thumb-title { color: var(--paper); }

/* ── Learner journey panel ───────────────────────── */
.lj-panel { border: 1px solid var(--line); border-radius: 3px; padding: .6rem .7rem; margin-bottom: .6rem; background: rgba(29,158,117,0.05); }
.lj-panel h4 { font-size: .7rem; letter-spacing: .14em; text-transform: uppercase; color: var(--teal); margin-bottom: .4rem; }
.lj-row { display: flex; justify-content: space-between; align-items: center; font-size: .76rem; color: var(--muted-strong); margin-bottom: .3rem; }
.lj-row b { color: var(--paper); font-weight: 600; }
.lj-bar { height: 5px; border-radius: 3px; background: rgba(244,239,228,0.12); overflow: hidden; margin: .35rem 0 .5rem; }
.lj-bar-fill { height: 100%; border-radius: 3px; background: linear-gradient(90deg, var(--teal), var(--amber)); }
.lj-chip { display: inline-flex; align-items: center; gap: 5px; font-size: .68rem; padding: .2rem .55rem; border-radius: 999px; border: 1px solid var(--line); }
.lj-chip.ok { border-color: rgba(29,158,117,.6); color: var(--teal); }
.lj-chip.warn { border-color: rgba(242,166,35,.6); color: var(--amber); }
.lj-chip.toast { border-color: var(--muted); color: var(--muted); }
.lj-action { font-size: .74rem; line-height: 1.5; color: var(--muted-strong); margin-top: .25rem; }
.lj-action .act-title { color: var(--paper); font-weight: 600; }
.lj-link { color: var(--teal); cursor: pointer; text-decoration: underline; }

/* Stage */
.stage { flex: 1; min-width: 0; display: flex; align-items: stretch; justify-content: center; padding: 1.5rem; }
.frame { width: 100%; max-width: 980px; border: 1px solid var(--line); background: rgba(244,239,228,0.02); position: relative; display: flex; flex-direction: column; overflow: hidden; }
.corner { position: absolute; width: 9px; height: 9px; border: 1px solid var(--amber); z-index: 2; }
.corner-tl { top: -1px; left: -1px; border-right: none; border-bottom: none; }
.corner-br { bottom: -1px; right: -1px; border-left: none; border-top: none; }
.slide-viewport { flex: 1; overflow-y: auto; padding: 2rem 2.5rem; }

/* Slide content */
.count-label { font-family: 'Space Grotesk', sans-serif; font-size: .75rem; color: var(--amber); letter-spacing: .12em; text-transform: uppercase; margin-bottom: .6rem; }
.slide-title { font-size: 1.65rem; margin-bottom: .9rem; line-height: 1.25; }
.slide-text { font-size: 1rem; color: var(--muted-strong); line-height: 1.8; white-space: pre-wrap; word-wrap: break-word; }

.type-selector { display: flex; gap: 8px; margin: 1.1rem 0 .4rem; flex-wrap: wrap; }
.type-btn { padding: .45rem .95rem; border: 1px solid var(--line); border-radius: 2px; background: transparent; color: var(--muted); cursor: pointer; font-size: .84rem; transition: all .15s; }
.type-btn:hover { border-color: var(--amber); color: var(--paper); }
.type-btn.selected { background: var(--amber); color: var(--ink); font-weight: 600; border-color: var(--amber); }

.visual-area { border: 1px solid var(--line); border-radius: 2px; min-height: 260px; display: flex; align-items: center; justify-content: center; margin-top: .9rem; overflow: hidden; background: rgba(244,239,228,0.02); position: relative; }
.visual-area > * { max-width: 100%; }
.visual-area svg { width: 100%; height: auto; }
.visual-loading { text-align: center; padding: 2rem; color: var(--amber); font-size: .9rem; }
.visual-loading .spinner { display: inline-block; width: 24px; height: 24px; border: 2px solid var(--line); border-top-color: var(--amber); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: .5rem; }
@keyframes spin { to { transform: rotate(360deg); } }
.visual-error { text-align: center; padding: 2rem; color: var(--coral); font-size: .85rem; }
.controls { display: flex; gap: 8px; justify-content: center; margin-top: .8rem; }
.icon-btn { background: transparent; border: 1px solid var(--line); color: var(--muted-strong); border-radius: 2px; padding: .45rem .85rem; font-size: .83rem; cursor: pointer; transition: border-color .15s, color .15s; }
.icon-btn:hover { border-color: var(--amber); color: var(--paper); }
.icon-btn:disabled { opacity: .35; cursor: default; }

.anim-scene-card { transition: all .3s; }
video { width: 100%; max-height: 420px; border-radius: 2px; background: #000; }

/* ── Motion Engine v2 ───────────────────────────── */
.ae-wrap { position: relative; width: 100%; min-height: 340px; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; background: radial-gradient(1200px 500px at 50% -10%, rgba(242,166,35,0.06), transparent 60%), #0B1626; }
.ae-stage { position: absolute; inset: 0; transition: transform 1.1s cubic-bezier(.22,.9,.28,1.02); transform-origin: center center; }
.ae-edges { position: absolute; inset: 0; width: 100%; height: 100%; }
.ae-edge { stroke-dasharray: 7 9; animation: aeFlow 1.1s linear infinite; opacity: 0; transition: opacity .8s; }
.ae-edge.on { opacity: .55; }
@keyframes aeFlow { to { stroke-dashoffset: -32; } }
.ae-particle { fill: var(--amber); opacity: 0; }
.ae-particle.on { animation: aeTravel 1.6s ease-in-out infinite; }
@keyframes aeTravel { 0% { opacity: 0; } 12% { opacity: .95; } 88% { opacity: .95; } 100% { opacity: 0; } }

.ae-node { position: absolute; transform: translate(-50%,-50%) scale(.55); opacity: 0; transition: transform .85s cubic-bezier(.18,1.35,.35,1), opacity .5s ease, box-shadow .4s; cursor: pointer; user-select: none; text-align: center; padding: .55rem .8rem; border-radius: 10px; background: linear-gradient(160deg, rgba(244,239,228,0.09), rgba(244,239,228,0.03)); border: 1px solid rgba(244,239,228,0.22); backdrop-filter: blur(3px); max-width: 190px; }
.ae-node:hover { border-color: var(--amber); box-shadow: 0 6px 22px rgba(0,0,0,.45); z-index: 5; }
.ae-node.revealed { opacity: 1; transform: translate(-50%,-50%) scale(1); }
.ae-node.hub { background: linear-gradient(160deg, rgba(242,166,35,0.28), rgba(242,166,35,0.08)); border-color: rgba(242,166,35,0.65); }
.ae-node .ae-nlabel { font-family: 'Space Grotesk', sans-serif; font-size: .82rem; font-weight: 600; color: var(--paper); line-height: 1.25; }
.ae-node .ae-nsub { font-size: .62rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-top: .2rem; }
.ae-node.glowing::before { content: ''; position: absolute; inset: -7px; border-radius: 14px; border: 2px solid var(--glow, var(--amber)); animation: aePulse 1s ease-out forwards; pointer-events: none; }
@keyframes aePulse { 0% { opacity: .95; transform: scale(.92); } 100% { opacity: 0; transform: scale(1.28); } }
.ae-node.inspected { border-color: var(--teal); box-shadow: 0 0 0 2px rgba(29,158,117,.35), 0 8px 26px rgba(0,0,0,.5); }

.ae-caption { position: absolute; left: 0; right: 0; bottom: 46px; display: flex; justify-content: center; pointer-events: none; z-index: 6; }
.ae-caption span { background: rgba(11,22,38,.78); border: 1px solid var(--line); border-radius: 999px; padding: .35rem 1rem; font-size: .82rem; color: var(--paper); backdrop-filter: blur(4px); }
.ae-caption b { color: var(--amber); }

.ae-hud { position: absolute; left: 0; right: 0; bottom: 0; padding: .5rem .75rem .6rem; background: linear-gradient(transparent, rgba(11,22,38,.92) 40%); z-index: 7; }
.ae-progress { height: 4px; border-radius: 2px; background: rgba(244,239,228,0.12); position: relative; cursor: pointer; }
.ae-progress-fill { position: absolute; inset: 0 auto 0 0; width: 0%; border-radius: 2px; background: linear-gradient(90deg, var(--teal), var(--amber)); }
.ae-tick { position: absolute; top: -3px; width: 2px; height: 10px; background: rgba(244,239,228,0.35); cursor: pointer; }
.ae-tick:hover { background: var(--amber); }
.ae-controls { display: flex; align-items: center; gap: 6px; margin-top: .45rem; flex-wrap: wrap; }
.ae-btn { background: transparent; border: 1px solid var(--line); color: var(--paper); border-radius: 6px; padding: .28rem .7rem; font-size: .76rem; cursor: pointer; transition: all .15s; }
.ae-btn:hover { border-color: var(--amber); color: var(--amber); }
.ae-btn.primary { background: var(--amber); border-color: var(--amber); color: var(--ink); font-weight: 700; }
.ae-scene-chip { font-size: .68rem; padding: .22rem .55rem; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); cursor: pointer; transition: all .2s; white-space: nowrap; max-width: 150px; overflow: hidden; text-overflow: ellipsis; }
.ae-scene-chip.active { border-color: var(--amber); color: var(--amber); background: rgba(242,166,35,0.08); }
.ae-time { font-family: 'Space Grotesk', sans-serif; font-size: .7rem; color: var(--muted); margin-left: auto; }

/* Inspector panel */
.ae-inspector { position: absolute; top: 10px; right: 10px; bottom: 56px; width: 270px; max-width: 70%; background: rgba(13,25,43,.94); border: 1px solid rgba(29,158,117,0.5); border-radius: 10px; padding: .9rem 1rem; z-index: 20; overflow-y: auto; transform: translateX(115%); transition: transform .45s cubic-bezier(.2,1.2,.3,1); box-shadow: -8px 10px 34px rgba(0,0,0,.5); }
.ae-inspector.open { transform: translateX(0); }
.ae-inspector h4 { font-family: 'Space Grotesk', sans-serif; font-size: .95rem; color: var(--teal); margin-bottom: .15rem; padding-right: 1.4rem; }
.ae-inspector .ae-i-kicker { font-size: .62rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-bottom: .5rem; }
.ae-inspector p { font-size: .8rem; color: var(--muted-strong); line-height: 1.65; margin-bottom: .5rem; }
.ae-inspector .ae-i-scenes { font-size: .68rem; color: var(--amber); }
.ae-i-close { position: absolute; top: .55rem; right: .65rem; background: none; border: none; color: var(--muted); font-size: 1rem; cursor: pointer; }
.ae-i-close:hover { color: var(--coral); }

/* Recommendation chip */
.reco-chip { display: inline-flex; align-items: center; gap: 6px; font-size: .72rem; color: var(--teal); border: 1px dashed rgba(29,158,117,.5); border-radius: 999px; padding: .25rem .7rem; margin-left: .4rem; }

/* States */
.state-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem; text-align: center; }
.state-icon { font-size: 2.2rem; margin-bottom: 1rem; }
.state-msg { color: var(--muted-strong); font-size: .95rem; max-width: 420px; line-height: 1.6; margin-bottom: 1.25rem; }

/* Footer nav */
footer { display: flex; align-items: center; justify-content: space-between; padding: .6rem 1.25rem; border-top: 1px solid var(--line); flex-shrink: 0; }
.nav-btn { background: transparent; color: var(--paper); border: 1px solid var(--line); padding: .5rem 1.3rem; border-radius: 2px; cursor: pointer; font-size: .88rem; transition: border-color .15s; }
.nav-btn:hover:not(:disabled) { border-color: var(--amber); color: var(--amber); }
.nav-btn:disabled { opacity: .3; cursor: default; }
.counter { font-family: 'Space Grotesk', sans-serif; font-size: .9rem; color: var(--muted-strong); letter-spacing: .05em; }
.counter b { color: var(--amber); font-weight: 700; }
.footer-hint { font-size: .72rem; color: var(--muted); }

/* ── Present mode ───────────────────────────────── */
body.presenting header,
body.presenting .sidebar,
body.presenting footer { display: none; }
body.presenting .stage { padding: 0; }
body.presenting .frame { max-width: none; border: none; }
body.presenting .slide-viewport { padding: 3rem 4rem; display: flex; flex-direction: column; justify-content: center; }
body.presenting .slide-title { font-size: 2.3rem; }
body.presenting .slide-text { font-size: 1.2rem; }
.present-exit { position: fixed; top: 14px; right: 14px; z-index: 50; background: rgba(14,26,43,0.7); border: 1px solid var(--line); color: var(--muted-strong); border-radius: 2px; padding: .4rem .9rem; font-size: .78rem; cursor: pointer; display: none; }
body.presenting .present-exit { display: block; }
.present-arrow { position: fixed; top: 50%; transform: translateY(-50%); z-index: 50; background: rgba(14,26,43,0.55); border: 1px solid var(--line); color: var(--paper); width: 44px; height: 64px; font-size: 1.2rem; cursor: pointer; display: none; border-radius: 3px; }
body.presenting .present-arrow { display: block; }
.present-arrow:hover { border-color: var(--amber); color: var(--amber); }
#arrLeft { left: 12px; }
#arrRight { right: 12px; }

@media (max-width: 720px) {
    .sidebar { display: none; }
    .deck-title { display: none; }
}

/* ── Quiz / checkpoint (P6) ─────────────────────── */
.lj-take { display: inline-block; margin-top: .4rem; background: var(--amber); color: var(--ink); border: none; border-radius: 2px; padding: .38rem .85rem; font-size: .76rem; font-weight: 700; cursor: pointer; transition: background .15s, transform .15s; }
.lj-take:hover { background: #ffbf47; }
.lj-take:active { transform: scale(.96); }
.lj-take:disabled { opacity: .35; cursor: default; }

.quiz-overlay { position: fixed; inset: 0; z-index: 100; background: rgba(8,16,28,0.88); backdrop-filter: blur(3px); display: flex; align-items: center; justify-content: center; padding: 1.25rem; }
.quiz-overlay.hidden { display: none; }
.quiz-card { background: var(--ink); border: 1px solid var(--line); border-radius: 8px; width: 100%; max-width: 760px; max-height: 92vh; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 24px 70px rgba(0,0,0,.6); }
.quiz-head { padding: 1rem 1.4rem; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
.quiz-head h3 { font-size: 1.05rem; color: var(--paper); }
.quiz-sub { font-size: .72rem; color: var(--muted); margin-top: .2rem; }
.quiz-close { background: none; border: none; color: var(--muted); font-size: 1.3rem; cursor: pointer; line-height: 1; }
.quiz-close:hover { color: var(--coral); }
.quiz-body { flex: 1; overflow-y: auto; padding: 1.4rem; }
.quiz-progress { font-family: 'Space Grotesk', sans-serif; font-size: .72rem; color: var(--amber); letter-spacing: .08em; margin-bottom: .8rem; }
.quiz-progress-bar { height: 4px; border-radius: 2px; background: rgba(244,239,228,0.12); overflow: hidden; margin-bottom: .9rem; }
.quiz-progress-fill { height: 100%; background: linear-gradient(90deg, var(--teal), var(--amber)); transition: width .25s; }
.quiz-qstem { font-family: 'Space Grotesk', sans-serif; font-size: 1.15rem; color: var(--paper); line-height: 1.4; margin-bottom: .3rem; }
.quiz-qmeta { font-size: .72rem; color: var(--muted); margin-bottom: 1.1rem; display: flex; gap: 10px; flex-wrap: wrap; }
.quiz-options { display: flex; flex-direction: column; gap: .55rem; }
.quiz-opt { display: flex; align-items: center; gap: .75rem; border: 1px solid var(--line); border-radius: 4px; padding: .8rem 1rem; cursor: pointer; transition: border-color .15s, background .15s; background: rgba(244,239,228,0.02); }
.quiz-opt:hover { border-color: var(--amber); }
.quiz-opt input { accent-color: var(--amber); flex-shrink: 0; }
.quiz-opt.selected { border-color: var(--amber); background: rgba(242,166,35,0.08); }
.quiz-opt .q-opt-letter { font-family: 'Space Grotesk', sans-serif; font-size: .78rem; color: var(--amber); font-weight: 700; min-width: 20px; }
.quiz-opt .q-opt-text { font-size: .92rem; color: var(--muted-strong); line-height: 1.5; }
.quiz-opt.correct { border-color: var(--teal); background: rgba(29,158,117,0.12); }
.quiz-opt.correct .q-opt-text { color: var(--paper); }
.quiz-opt.incorrect { border-color: var(--coral); background: rgba(216,90,48,0.12); }
.quiz-opt.incorrect .q-opt-text { color: var(--paper); }
.quiz-feedback { margin-top: 1rem; border: 1px solid var(--line); border-left: 3px solid var(--teal); border-radius: 3px; padding: .8rem 1rem; font-size: .85rem; line-height: 1.6; color: var(--muted-strong); background: rgba(244,239,228,0.02); }
.quiz-feedback.wrong { border-left-color: var(--coral); }
.quiz-feedback b { color: var(--paper); }
.quiz-foot { padding: .9rem 1.4rem; border-top: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-shrink: 0; flex-wrap: wrap; }
.quiz-nav { display: flex; gap: 8px; }
.quiz-review { border: 1px dashed rgba(29,158,117,.5); border-radius: 4px; padding: 1.1rem; margin-top: .5rem; }

/* Result screen */
.quiz-result { text-align: center; padding: 1.4rem .5rem; }
.quiz-score-ring { width: 120px; height: 120px; border-radius: 50%; margin: 0 auto 1rem; display: flex; align-items: center; justify-content: center; border: 6px solid var(--line); font-family: 'Space Grotesk', sans-serif; font-size: 1.7rem; font-weight: 700; color: var(--paper); }
.quiz-score-ring.pass { border-color: var(--teal); }
.quiz-score-ring.fail { border-color: var(--coral); }
.quiz-result h3 { font-size: 1.3rem; margin-bottom: .3rem; }
.quiz-result .quiz-result-sub { color: var(--muted); margin-bottom: 1.2rem; }
.quiz-result-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.quiz-result-row { display: flex; justify-content: space-between; font-size: .84rem; color: var(--muted-strong); padding: .4rem 0; border-bottom: 1px solid var(--line); }
.quiz-result-row b { color: var(--paper); }
</style>
</head>
<body>

<header>
    <a href="/frontend/upload.html" class="brand">
        <div class="brand-mark">EV</div>
        <span class="brand-name">EduVision Player</span>
    </a>
    <span class="deck-title" id="deckName"></span>
    <button class="btn-present" id="presentBtn" onclick="enterPresent()">&#9654; Present</button>
</header>

<div class="main">
    <aside class="sidebar" id="sidebar">
        <div id="ljPanel"></div>
    </aside>
    <section class="stage">
        <div class="frame" id="frame" style="display:none;">
            <div class="corner corner-tl"></div><div class="corner corner-br"></div>
            <div class="slide-viewport" id="viewport"></div>
        </div>
        <div class="state-wrap" id="stateWrap"></div>
    </section>
</div>

<footer>
    <button class="nav-btn" id="prevBtn" onclick="prevSlide()">&#9664; Previous</button>
    <span class="counter" id="counter"><b>0</b> / 0</span>
    <button class="nav-btn" id="nextBtn" onclick="nextSlide()">Next &#9654;</button>
</footer>

<button class="present-exit" onclick="exitPresent()">Exit Present (Esc)</button>
<button class="present-arrow" id="arrLeft" onclick="prevSlide()">&#9664;</button>
<button class="present-arrow" id="arrRight" onclick="nextSlide()">&#9654;</button>

<div class="quiz-overlay hidden" id="quizOverlay">
    <div class="quiz-card" id="quizCard"></div>
</div>

<script>
const API = '/api/v1';
const user = JSON.parse(localStorage.getItem('user') || 'null');
if (!user) { window.location.href = '/frontend/signin.html'; }

function authHeaders() {
    const token = localStorage.getItem('access_token');
    return token ? { 'Authorization': 'Bearer ' + token } : {};
}

async function authFetch(url, opts = {}) {
    if (!opts.headers) opts.headers = {};
    Object.assign(opts.headers, authHeaders());
    let res = await fetch(url, opts);
    if (res.status === 401) {
        try {
            const refreshRes = await fetch(API + '/auth/refresh', { method: 'POST' });
            if (refreshRes.ok) {
                const refreshData = await refreshRes.json();
                const newToken = refreshData.access_token || refreshData.data?.access_token || refreshData.tokens?.access_token;
                if (newToken) {
                    localStorage.setItem('access_token', newToken);
                    if (refreshData.refresh_token || refreshData.data?.refresh_token || refreshData.tokens?.refresh_token) {
                        localStorage.setItem('refresh_token', refreshData.refresh_token || refreshData.data?.refresh_token || refreshData.tokens?.refresh_token);
                    }
                    opts.headers['Authorization'] = 'Bearer ' + newToken;
                    res = await fetch(url, opts);
                }
            }
        } catch (e) { /* refresh failed */ }
        if (res.status === 401) {
            window.location.href = '/frontend/signin.html';
            throw new Error('Session expired. Please sign in again.');
        }
    }
    return res;
}

const params = new URLSearchParams(window.location.search);
const lessonId = params.get('lesson');
const deckId = params.get('deck');
if (!lessonId) { window.location.href = '/frontend/upload.html'; }

let topics = [];
let sessionId = null;
let slides = [];          // { kind: 'concept'|'visual', topicIdx }
let current = 0;
let selectedTypes = {};   // topicIdx -> type
let generated = {};       // visual slide key -> true (already rendered)

// ── Init ─────────────────────────────────────────────────────────────────
async function init() {
    showState('<div class="state-icon">&#9698;</div><p class="state-msg">Loading presentation&hellip;</p>');
    try {
        const startRes = await authFetch(API + '/lessons/' + lessonId + '/player/start', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({}),
        });
        if (!startRes.ok) await apiError(startRes);
        const startData = await startRes.json();
        const state = startData.data;
        topics = state.topics || [];
        sessionId = state.session ? state.session.session_id : null;
        learnerCompletion = state.session ? (state.session.completion_percentage || 0) : 0;

        if (!topics.length) {
            showState('<div class="state-icon">&#128196;</div>' +
                '<p class="state-msg">This presentation has no slides yet.</p>' +
                '<button class="btn-present" style="margin:0 auto;" onclick="window.location.href=\'/frontend/upload.html\'">Create a Deck</button>');
            return;
        }

        // Build dynamic slide list: concept + visual pair per topic
        slides = [];
        topics.forEach((t, i) => {
            slides.push({ kind: 'concept', topicIdx: i });
            slides.push({ kind: 'visual', topicIdx: i });
        });

        document.getElementById('deckName').textContent =
            (state.lesson && state.lesson.title) || 'Lesson';
        document.getElementById('frame').style.display = 'flex';
        document.getElementById('stateWrap').style.display = 'none';
        buildThumbnails();
        loadLearnerJourney();
        goTo(startIndexFromUrl(), false);
    } catch (e) {
        showState('<div class="state-icon">&#9888;</div>' +
            '<p class="state-msg">Failed to load presentation: ' + escHtml(e.message) + '</p>' +
            '<button class="btn-present" style="margin:0 auto;" onclick="init()">Retry</button>');
    }
}

function startIndexFromUrl() {
    const s = parseInt(params.get('slide'), 10);
    if (!isNaN(s) && s >= 0 && s < slides.length) return s;
    return 0;
}

function showState(html) {
    document.getElementById('frame').style.display = 'none';
    const w = document.getElementById('stateWrap');
    w.style.display = 'flex';
    w.innerHTML = html;
}

// ── Thumbnails ───────────────────────────────────────────────────────────
function buildThumbnails() {
    const sb = document.getElementById('sidebar');
    const lj = document.getElementById('ljPanel');
    sb.innerHTML = '';
    const frag = document.createDocumentFragment();
    slides.forEach((s, i) => {
        const t = topics[s.topicIdx];
        const el = document.createElement('div');
        el.className = 'thumb';
        el.id = 'thumb-' + i;
        el.onclick = () => goTo(i);
        el.innerHTML =
            '<span class="thumb-num">' + String(i + 1).padStart(2, '0') + '</span>' +
            '<span class="thumb-kind">' + (s.kind === 'concept' ? 'Concept' : 'Visual') + '</span>' +
            '<div class="thumb-title">' + escHtml(t.title || 'Untitled') + '</div>';
        frag.appendChild(el);
    });
    if (lj) sb.appendChild(lj);
    sb.appendChild(frag);
}

let learnerState = { completion: 0, checkpoint: null, mastery: null };
let learnerCompletion = 0;

async function loadLearnerJourney() {
    const panel = document.getElementById('ljPanel');
    if (!panel) return;
    try {
        const [cpRes, msRes] = await Promise.all([
            authFetch(API + '/lessons/' + lessonId + '/player/checkpoint'),
            authFetch(API + '/lessons/' + lessonId + '/player/mastery'),
        ]);
        const cp = cpRes.ok ? (await cpRes.json()).data : null;
        const ms = msRes.ok ? (await msRes.json()).data : null;

        learnerState = { completion: learnerCompletion, checkpoint: cp, mastery: ms };
        renderLearnerJourney(panel);
    } catch (e) {
        panel.innerHTML = '';
    }
}

function renderLearnerJourney(panel) {
    if (!panel) return;
    let html = '<div class="lj-panel"><h4>Learner Progress</h4>';

    html += '<div class="lj-row"><span>Lesson progress</span><b>' +
        Math.round(learnerState.completion) + '%</b></div>' +
        '<div class="lj-bar"><div class="lj-bar-fill" style="width:' +
        Math.min(100, Math.max(0, learnerState.completion)) + '%;"></div></div>';

    const cp = learnerState.checkpoint;
    if (cp && cp.has_checkpoint) {
        const q = cp.quiz || {};
        const chip = cp.completed
            ? '<span class="lj-chip ok">&#10003; Checkpoint passed</span>'
            : '<span class="lj-chip warn">&#9654; Checkpoint pending</span>';
        html += '<div class="lj-row"><span>Assessment</span>' + chip + '</div>';
        if (cp.latest_attempt && cp.latest_attempt.percent_score != null) {
            html += '<div class="lj-action">Score: <b>' +
                Math.round(cp.latest_attempt.percent_score) + '%</b>' +
                (cp.latest_attempt.percent_score >= (q.passing_score || 0) ? ' &mdash; passed' : ' &mdash; keep going') +
                '</div>';
        }
        if (cp.available_attempts > 0 && q.id) {
            html += '<div class="lj-action">Checkpoint available &middot; ' +
                cp.available_attempts + ' attempt(s) left</div>';
            if (!cp.completed) {
                html += '<button class="lj-take" onclick="startQuiz(\'' + escHtml(String(q.id)) + '\')">&#9654; Take Checkpoint</button>';
            }
        }
    } else {
        html += '<div class="lj-row"><span>Assessment</span><span class="lj-chip toast">none yet</span></div>';
    }

    const na = learnerState.mastery && learnerState.mastery.next_action;
    if (na && na.title) {
        html += '<div class="lj-action"><span class="act-title">Next up:</span> ' +
            escHtml(na.title) + '<br><span style="color:var(--muted);font-size:.68rem;">' +
            escHtml(na.reason || '') + '</span></div>';
    }

    html += '</div>';
    panel.innerHTML = html;
}

// ── Rendering (active slide only — scales to any deck size) ─────────────
function renderSlide() {
    const vp = document.getElementById('viewport');
    const s = slides[current];
    const t = topics[s.topicIdx];
    const idx = s.topicIdx;

    if (s.kind === 'concept') {
        vp.innerHTML =
            '<p class="count-label">Topic ' + (idx + 1) + ' &middot; Concept</p>' +
            '<h2 class="slide-title">' + escHtml(t.title || '') + '</h2>' +
            '<p class="slide-text">' + escHtml(t.description || 'No description available.') + '</p>';
    } else {
        const chosen = selectedTypes[idx] || 'auto';
        const reco = recommendVisualType(t);
        const effective = chosen === 'auto' ? reco : chosen;
        const types = ['auto', 'image', 'animation', 'video', 'simulation'];
        let html =
            '<p class="count-label">Topic ' + (idx + 1) + ' &middot; Visual</p>' +
            '<h2 class="slide-title">' + escHtml(t.title || '') + '</h2>' +
            '<div class="type-selector" id="types-' + idx + '">' +
            types.map(tp =>
                '<button class="type-btn' + (tp === chosen ? ' selected' : '') + '" data-type="' + tp + '" onclick="selectType(' + idx + ',\'' + tp + '\')">' +
                (tp === 'auto' ? '&#10022; Auto' : tp.charAt(0).toUpperCase() + tp.slice(1)) + '</button>').join('') +
            '<span class="reco-chip" id="reco-' + idx + '"></span>' +
            '</div>' +
            '<div class="visual-area" id="va-' + idx + '" style="border:none;background:transparent;">' +
            '<div class="visual-loading"><div>Pick a visual type above, then Generate.</div></div></div>' +
            '<div class="controls" id="ctrl-' + idx + '" style="display:none;"></div>' +
            '<div class="controls"><button class="icon-btn" onclick="generateVisual(' + idx + ')">Generate Visual</button></div>';
        vp.innerHTML = html;
        updateRecoChip(idx, t, chosen, reco, effective);

        // Restore already-generated visual for this topic (cached render)
        const cached = window['_vis_' + idx];
        if (cached !== undefined && cached.type === effective) {
            document.getElementById('va-' + idx).innerHTML = cached.html;
            if (typeof cached.after === 'function') cached.after();
        }
    }
}

function recommendVisualType(topic) {
    const text = ((topic.title || '') + ' ' + (topic.description || '')).toLowerCase();
    const has = (...words) => words.some(w => text.includes(w));
    if (has('simulat', 'interactive', 'practice', 'hands-on', 'experiment', 'sort', 'cpu', 'execute', 'step through')) {
        return { type: 'simulation', reason: 'concept invites step-by-step interaction' };
    }
    if (has('flow', 'process', 'sequence', 'stage', 'how does', 'how it works', 'mechanism', 'transform', 'encrypt', 'decrypt', 'transfer', 'transmit', 'exchange', 'cycle', 'convert', 'generate', 'algorithm', 'protocol', 'architecture', 'model', 'system', 'network', 'structure', 'key', 'function')) {
        return { type: 'animation', reason: 'concept has motion / cause-and-effect structure' };
    }
    if (has('watch', 'demo video', 'lecture video', 'narrated')) {
        return { type: 'video', reason: 'concept benefits from narrated walkthrough' };
    }
    return { type: 'image', reason: 'concept is a definition / static relationship' };
}

function updateRecoChip(idx, topic, chosen, reco, effective) {
    const chip = document.getElementById('reco-' + idx);
    if (!chip) return;
    if (chosen === 'auto') {
        chip.innerHTML = '&#10022; Auto picked <b style="color:var(--paper);">' + effective + '</b> &mdash; ' + escHtml(reco.reason);
    } else if (chosen !== reco.type) {
        chip.innerHTML = '&#9432; Auto would pick <b style="color:var(--paper);">' + reco.type + '</b> &mdash; ' + escHtml(reco.reason);
    } else {
        chip.innerHTML = '&#10003; matches concept analysis';
    }
}

// ── Navigation ───────────────────────────────────────────────────────────
function goTo(i, syncSession = true) {
    if (i < 0 || i >= slides.length) return;
    current = i;
    renderSlide();
    updateChrome();
    if (syncSession && sessionId) syncTopic();
}

function nextSlide() { if (current < slides.length - 1) goTo(current + 1); }
function prevSlide() { if (current > 0) goTo(current - 1); }

function updateChrome() {
    document.getElementById('counter').innerHTML = '<b>' + (current + 1) + '</b> / ' + slides.length;
    document.getElementById('prevBtn').disabled = current === 0;
    document.getElementById('nextBtn').disabled = current === slides.length - 1;
    document.querySelectorAll('.thumb').forEach(el => el.classList.remove('active'));
    const th = document.getElementById('thumb-' + current);
    if (th) {
        th.classList.add('active');
        th.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }
}

let syncTimer = null;
function syncTopic() {
    // Best-effort session tracking; never blocks navigation.
    clearTimeout(syncTimer);
    syncTimer = setTimeout(async () => {
        try {
            await authFetch(API + '/lessons/' + lessonId + '/player/set-topic', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ session_id: sessionId, topic_index: slides[current].topicIdx }),
            });
        } catch (e) { /* non-critical */ }
    }, 400);
}

// ── Keyboard ─────────────────────────────────────────────────────────────
document.addEventListener('keydown', (e) => {
    const tag = (document.activeElement && document.activeElement.tagName) || '';
    if (tag === 'INPUT' || tag === 'TEXTAREA') return;
    switch (e.key) {
        case 'ArrowRight': case 'PageDown': case ' ': nextSlide(); e.preventDefault(); break;
        case 'ArrowLeft': case 'PageUp': prevSlide(); e.preventDefault(); break;
        case 'Home': goTo(0); e.preventDefault(); break;
        case 'End': goTo(slides.length - 1); e.preventDefault(); break;
        case 'Escape': if (document.body.classList.contains('presenting')) exitPresent(); break;
        case 'f': case 'F': if (!document.body.classList.contains('presenting')) enterPresent(); break;
    }
});

// ── Present mode ─────────────────────────────────────────────────────────
async function enterPresent() {
    document.body.classList.add('presenting');
    try { await document.documentElement.requestFullscreen(); } catch (e) { /* denied */ }
}
function exitPresent() {
    document.body.classList.remove('presenting');
    try { if (document.fullscreenElement) document.exitFullscreen(); } catch (e) { /* ignore */ }
}
document.addEventListener('fullscreenchange', () => {
    if (!document.fullscreenElement) document.body.classList.remove('presenting');
});

// ── Visual generation (existing EduVision endpoints) ────────────────────
function selectType(topicIdx, type) {
    selectedTypes[topicIdx] = type;
    const selector = document.getElementById('types-' + topicIdx);
    if (!selector) return;
    selector.querySelectorAll('.type-btn').forEach(b => {
        b.classList.toggle('selected', b.dataset.type === type);
    });
    updateRecoChip(topicIdx, topics[topicIdx], type, recommendVisualType(topics[topicIdx]),
        type === 'auto' ? recommendVisualType(topics[topicIdx]).type : type);
}

async function generateVisual(topicIdx) {
    let type = selectedTypes[topicIdx] || 'auto';
    if (type === 'auto') type = recommendVisualType(topics[topicIdx]).type;
    const topic = topics[topicIdx];
    const area = document.getElementById('va-' + topicIdx);
    if (!area) return;
    area.innerHTML = '<div class="visual-loading"><div class="spinner"></div><div>Generating ' + type + '&hellip;</div></div>';
    try {
        if (type === 'image') await generateCanvas(topicIdx, topic);
        else if (type === 'animation') await generateAnimation(topicIdx, topic);
        else if (type === 'video') await generateVideo(topicIdx, topic);
        else if (type === 'simulation') await generateSimulation(topicIdx, topic);
    } catch (e) {
        area.innerHTML = '<div class="visual-error">Generation failed: ' + escHtml(e.message) + '</div>';
    }
}

function cacheVisual(topicIdx, html, after) {
    window['_vis_' + topicIdx] = { html, after };
}

async function apiError(res) {
    let msg = 'API error ' + res.status;
    try {
        const j = await res.json();
        if (j.error && j.error.message) msg = j.error.message;
        else if (j.detail) msg = typeof j.detail === 'string' ? j.detail : msg;
    } catch (e) { /* not json */ }
    throw new Error(msg);
}

async function generateCanvas(idx, topic) {
    const createRes = await authFetch(API + '/visual/canvases', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ content: topic.title + ': ' + (topic.description || ''), title: topic.title }),
    });
    if (!createRes.ok) await apiError(createRes);
    const createData = await createRes.json();
    const canvasMeta = createData.data || createData;
    const canvasId = canvasMeta.canvas_id;
    if (!canvasId) throw new Error('No canvas_id returned');

    const [nodesRes, edgesRes, compsRes] = await Promise.all([
        authFetch(API + '/visual/canvases/' + canvasId + '/nodes'),
        authFetch(API + '/visual/canvases/' + canvasId + '/edges'),
        authFetch(API + '/visual/canvases/' + canvasId + '/components').catch(() => null),
    ]);
    if (!nodesRes.ok) throw new Error('Failed to fetch canvas nodes');
    const nodesJson = await nodesRes.json();
    const edgesJson = edgesRes.ok ? await edgesRes.json() : { data: [] };

    // Pedagogical metadata is optional enrichment; never a hard dependency.
    let compsById = {};
    try {
        if (compsRes && compsRes.ok) {
            ((await compsRes.json()).data || []).forEach(c => { compsById[c.node_id] = c; });
        }
    } catch (e) { compsById = {}; }

    renderEducationalVisual(idx, topic, canvasMeta, nodesJson.data || [], edgesJson.data || [], compsById);
}

function renderCanvasSVG(idx, title, nodes, edges) {
    const area = document.getElementById('va-' + idx);
    if (!area) return;
    if (nodes.length === 0) {
        area.innerHTML = '<div class="visual-error">No visual elements generated.</div>';
        return;
    }
    const W = 900, H = 460;
    const cx = W / 2, cy = H / 2 + 14;
    const radius = Math.min(W, H) * 0.36;
    let svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg">';
    svg += '<defs><marker id="arrowhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="rgba(244,239,228,0.4)" stroke-width="1.5"/></marker></defs>';
    svg += '<text x="' + W/2 + '" y="22" text-anchor="middle" fill="#F2A623" font-size="13" font-family="Space Grotesk,sans-serif">' + escSvg(title) + '</text>';
    const positions = nodes.map((n, i) => {
        const angle = (2 * Math.PI * i) / nodes.length - Math.PI / 2;
        return { x: cx + radius * Math.cos(angle), y: cy + radius * Math.sin(angle), node: n };
    });
    edges.forEach(e => {
        const fromIdx = nodes.findIndex(n => n.node_id === e.source_node_id);
        const toIdx = nodes.findIndex(n => n.node_id === e.target_node_id);
        if (fromIdx >= 0 && toIdx >= 0) {
            svg += '<line x1="' + positions[fromIdx].x + '" y1="' + positions[fromIdx].y + '" x2="' + positions[toIdx].x + '" y2="' + positions[toIdx].y + '" stroke="rgba(244,239,228,0.25)" stroke-width="1.5" marker-end="url(#arrowhead)"/>';
            if (e.label) {
                const mx = (positions[fromIdx].x + positions[toIdx].x) / 2;
                const my = (positions[fromIdx].y + positions[toIdx].y) / 2;
                svg += '<text x="' + mx + '" y="' + (my - 6) + '" text-anchor="middle" fill="rgba(244,239,228,0.55)" font-size="10">' + escSvg(e.label.substring(0, 28)) + '</text>';
            }
        }
    });
    positions.forEach(p => {
        const label = p.node.label || '';
        const cat = p.node.category || 'concept';
        const fill = cat === 'core' ? 'rgba(242,166,35,0.2)' : cat === 'supporting' ? 'rgba(29,158,117,0.15)' : 'rgba(244,239,228,0.08)';
        const stroke = cat === 'core' ? '#F2A623' : cat === 'supporting' ? '#1D9E75' : 'rgba(244,239,228,0.3)';
        svg += '<g>';
        svg += '<circle cx="' + p.x + '" cy="' + p.y + '" r="34" fill="' + fill + '" stroke="' + stroke + '" stroke-width="1.5"/>';
        svg += '<text x="' + p.x + '" y="' + (p.y - 4) + '" text-anchor="middle" fill="#F4EFE4" font-size="11">' + escSvg(label.substring(0, 20)) + '</text>';
        svg += '<text x="' + p.x + '" y="' + (p.y + 11) + '" text-anchor="middle" fill="rgba(244,239,228,0.55)" font-size="9">' + escSvg(cat) + '</text>';
        svg += '</g>';
    });
    svg += '</svg>';
    area.innerHTML = svg;
    cacheVisual(idx, svg);
}

// ── Strategy-aware educational visuals ───────────────────────────────────
// The BACKEND selects the visualization strategy (pattern_type on POST
// /visual/canvases). These renderers only lay out returned data; they never
// classify topics or invent educational content.

var EV_AMBER = '#F2A623';
var EV_TEAL = '#1D9E75';
var EV_TEXT = '#F4EFE4';
var EV_MUTED = 'rgba(244,239,228,0.55)';
var EV_EDGE = 'rgba(244,239,228,0.25)';
var EV_DEFS = '<defs>'
    + '<marker id="evArr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="rgba(244,239,228,0.45)" stroke-width="1.5"/></marker>'
    + '<marker id="evArrT" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="rgba(29,158,117,0.7)" stroke-width="1.5"/></marker>'
    + '</defs>';

function evRendererFor(patternType) {
    var pt = String(patternType || '').toLowerCase().replace(/[_-]+/g, ' ').trim();
    if (pt === 'flowchart' || pt === 'algorithm steps' || pt === 'block diagram') return 'flowchart';
    if (pt === 'comparison layout') return 'comparison';
    if (pt === 'timeline') return 'timeline';
    if (pt === 'hierarchy' || pt === 'decision tree') return 'hierarchy';
    if (pt === 'scientific cycle') return 'cycle';
    return 'radial'; // Network Graph, Mind Map, unknown → legacy renderer
}

function renderEducationalVisual(idx, topic, meta, nodes, edges, compsById) {
    var area = document.getElementById('va-' + idx);
    if (!area) return;
    nodes = nodes || [];
    edges = edges || [];
    compsById = compsById || {};
    var patternType = String((meta && meta.pattern_type) || '');
    var category = String((meta && meta.category) || '');
    var used = evRendererFor(patternType);
    function legacy() {
        window['_evmeta_' + idx] = patternType + '|' + category + '|radial';
        renderCanvasSVG(idx, (meta && meta.title) || topic.title, nodes, edges);
    }
    if (!nodes.length || used === 'radial') { legacy(); return; }
    var svg = '';
    try {
        if (used === 'flowchart') svg = renderFlowchartSVG(nodes, compsById);
        else if (used === 'comparison') svg = renderComparisonSVG(nodes, compsById);
        else if (used === 'timeline') svg = renderTimelineSVG(nodes, compsById);
        else if (used === 'hierarchy') svg = renderHierarchySVG(nodes, edges, compsById);
        else if (used === 'cycle') svg = renderCycleSVG(nodes, compsById);
    } catch (err) {
        console.error('[EduVision] strategy renderer "' + used + '" failed:', err);
        svg = '';
    }
    if (!svg) { legacy(); return; }
    window['_evmeta_' + idx] = patternType + '|' + category + '|' + used;
    area.innerHTML = svg;
    cacheVisual(idx, svg);
}

function evWrap(text, maxChars, maxLines) {
    var words = String(text == null ? '' : text).replace(/\s+/g, ' ').trim().split(' ').filter(Boolean);
    if (!words.length) return [];
    var cap = maxLines || 3;
    var lines = [], cur = '';
    for (var i = 0; i < words.length; i++) {
        var cand = cur ? cur + ' ' + words[i] : words[i];
        if (cand.length <= maxChars || !cur) cur = cand;
        else { lines.push(cur); cur = words[i]; }
    }
    if (cur) lines.push(cur);
    return lines.slice(0, cap).map(function (l) {
        return l.length > maxChars + 6 ? l.substring(0, maxChars + 6) + '\u2026' : l;
    });
}

function evOverview(label, comp) {
    if (!comp) return '';
    var o = String(comp.overview || '').trim();
    if (!o) return '';
    var l = String(label || '').trim().toLowerCase();
    var stripped = o.replace(/^key concept:\s*/i, '').trim().toLowerCase();
    if (!stripped || stripped === l) return ''; // template duplicate adds no information
    return o;
}

function evLines(x, yTop, lines, size, fill, lh, anchor) {
    var s = '';
    for (var i = 0; i < lines.length; i++) {
        s += '<text x="' + x + '" y="' + (yTop + i * lh) + '" text-anchor="' + (anchor || 'middle')
            + '" fill="' + fill + '" font-size="' + size + '">' + escSvg(lines[i]) + '</text>';
    }
    return s;
}

function evBox(x, y, w, h, fill, stroke) {
    return '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h
        + '" rx="10" fill="' + fill + '" stroke="' + stroke + '" stroke-width="1.5"/>';
}

function renderFlowchartSVG(nodes, compsById) {
    var W = 900, H = 460, TOP = 34, GAP = 26;
    var items = nodes.map(function (n, i) {
        var label = (n.label && String(n.label).trim()) || ('Step ' + (i + 1));
        var ov = evOverview(label, compsById[n.node_id]);
        var lines = evWrap(label, 34, 3);
        var ovLines = ov ? evWrap(ov, 46, 2) : [];
        return {
            lines: lines,
            ovLines: ovLines,
            h: Math.max(44, 18 + lines.length * 15 + (ovLines.length ? ovLines.length * 12 + 3 : 0))
        };
    });
    function colH(list, gap) {
        return list.reduce(function (a, b) { return a + b.h; }, 0) + gap * Math.max(0, list.length - 1);
    }
    while (colH(items, GAP) > H - TOP - 14 && items.some(function (it) { return it.ovLines.length; })) {
        items.forEach(function (it) {
            if (it.ovLines.length) { it.ovLines = []; it.h = Math.max(44, 18 + it.lines.length * 15); }
        });
    }
    while (colH(items, GAP) > H - TOP - 14 && GAP > 14) GAP -= 4;
    var twoCol = colH(items, GAP) > H - TOP - 14;
    var half = Math.ceil(items.length / 2);
    var cols = twoCol ? [items.slice(0, half), items.slice(half)] : [items];
    var geo = twoCol ? [{ x: 110, w: 300 }, { x: 490, w: 300 }] : [{ x: 260, w: 380 }];
    var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg">' + EV_DEFS;
    var step = 0, lastBottoms = [];
    cols.forEach(function (col, ci) {
        var g = geo[ci], y = TOP;
        col.forEach(function (it, ii) {
            step++;
            var cxm = g.x + g.w / 2;
            var blockH = it.lines.length * 15 + (it.ovLines.length ? it.ovLines.length * 12 : 0);
            var ty = y + it.h / 2 - blockH / 2 + 12;
            svg += '<g class="ev-node">';
            svg += evBox(g.x, y, g.w, it.h, 'rgba(244,239,228,0.08)', 'rgba(242,166,35,0.55)');
            svg += '<circle cx="' + (g.x + 20) + '" cy="' + (y + it.h / 2) + '" r="11" fill="rgba(242,166,35,0.25)" stroke="' + EV_AMBER + '" stroke-width="1"/>';
            svg += '<text x="' + (g.x + 20) + '" y="' + (y + it.h / 2 + 4) + '" text-anchor="middle" fill="' + EV_AMBER + '" font-size="11">' + step + '</text>';
            svg += evLines(cxm + 12, ty, it.lines, 11, EV_TEXT, 15);
            if (it.ovLines.length) svg += evLines(cxm + 12, ty + it.lines.length * 15 + 3, it.ovLines, 9.5, EV_MUTED, 12);
            svg += '</g>';
            if (ii < col.length - 1) {
                svg += '<line x1="' + cxm + '" y1="' + (y + it.h + 3) + '" x2="' + cxm + '" y2="' + (y + it.h + GAP - 5)
                    + '" stroke="' + EV_EDGE + '" stroke-width="1.5" marker-end="url(#evArr)"/>';
            }
            y += it.h + GAP;
        });
        lastBottoms.push(y - GAP);
    });
    if (twoCol && cols[1].length) {
        var lx = geo[0].x + geo[0].w / 2, rx = geo[1].x + geo[1].w / 2;
        var midY = Math.min(lastBottoms[0] + 16, H - 10);
        svg += '<path d="M ' + lx + ' ' + lastBottoms[0] + ' L ' + lx + ' ' + midY + ' L ' + rx + ' ' + midY
            + ' L ' + rx + ' ' + (TOP - 6) + '" fill="none" stroke="' + EV_EDGE + '" stroke-width="1.5" marker-end="url(#evArr)"/>';
    }
    svg += '</svg>';
    return svg;
}

function renderComparisonSVG(nodes, compsById) {
    if (nodes.length === 1) return renderFlowchartSVG(nodes, compsById);
    var W = 900, H = 460, midX = 450;

    svg += '<line x1="' + midX + '" y1="36" x2="' + midX + '" y2="' + (H - 24) + '" stroke="' + EV_EDGE + '" stroke-width="1"/>';
    var colDefs = [{ tx: 70, w: 340 }, { tx: 490, w: 340 }];
    groups.forEach(function (grp, gi) {
        var c = colDefs[gi], cx = c.tx + c.w / 2, y = 64;
        var headerLabel = (grp[0].label && String(grp[0].label).trim()) || (gi === 0 ? 'Group A' : 'Group B');
        var hl = evWrap(headerLabel, 24, 2);
        svg += '<g class="ev-node">';
        svg += evLines(cx, y, hl, 13, EV_AMBER, 16);
        y += hl.length * 16 + 8;
        svg += '<rect x="' + (cx - 60) + '" y="' + (y - 6) + '" width="120" height="2" fill="rgba(242,166,35,0.6)"/>';
        svg += '</g>';

        grp.forEach(function (n, i) {

            svg += '<rect x="' + (c.tx + 4) + '" y="' + (y - 8) + '" width="7" height="7" fill="' + EV_TEAL + '"/>';
            svg += evLines(c.tx + 22, y, ll, 10.5, EV_TEXT, 13, 'start');
            if (ov) svg += evLines(c.tx + 22, y + ll.length * 13 + 3, evWrap(ov, 40, 1), 9, EV_MUTED, 11, 'start');
            svg += '</g>';
            y += ll.length * 13 + 4 + (ov ? 17 : 6);
        });

function renderTimelineSVG(nodes, compsById) {
    var W = 900, H = 460, axisY = 250, x0 = 90, x1 = 810;
    var n = nodes.length;
    var dense = n > 9;
    var wrapN = dense ? 14 : 22, size = dense ? 9 : 10.5, lh = dense ? 11 : 13;
    var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg">';
    svg += '<line x1="' + (x0 - 30) + '" y1="' + axisY + '" x2="' + (x1 + 30) + '" y2="' + axisY + '" stroke="' + EV_EDGE + '" stroke-width="1.5"/>';
    nodes.forEach(function (nd, i) {
        var x = n === 1 ? W / 2 : x0 + ((x1 - x0) * i) / (n - 1);
        var label = (nd.label && String(nd.label).trim()) || ('Stage ' + (i + 1));
        var lines = evWrap(label, wrapN, 3);
        var above = n > 1 && i % 2 === 0; // single node renders below the dot
        svg += '<g class="ev-node">';
        svg += '<circle cx="' + x + '" cy="' + axisY + '" r="' + (dense ? 5.5 : 7) + '" fill="' + EV_AMBER + '"/>';
        if (above) {
            var yBase = axisY - 34;
            svg += '<line x1="' + x + '" y1="' + (axisY - 11) + '" x2="' + x + '" y2="' + (yBase + 6) + '" stroke="' + EV_EDGE + '" stroke-width="1"/>';
            svg += evLines(x, yBase - (lines.length - 1) * lh, lines, size, EV_TEXT, lh);
        } else {
            var yTop = axisY + 38;
            svg += '<line x1="' + x + '" y1="' + (axisY + 11) + '" x2="' + x + '" y2="' + (yTop - 12) + '" stroke="' + EV_EDGE + '" stroke-width="1"/>';
            svg += evLines(x, yTop, lines, size, EV_TEXT, lh);
        }
        svg += '</g>';
    });
    svg += '</svg>';
    return svg;
}

function renderHierarchySVG(nodes, edges, compsById) {
    var W = 900, H = 460;
    var byId = {};
    nodes.forEach(function (n) { byId[n.node_id] = n; });
    var childrenMap = {}, childIds = {}, hasTree = false;
    (edges || []).forEach(function (e) {
        if ((e.relationship_type || '') === 'parent_child' && byId[e.source_node_id] && byId[e.target_node_id]) {
            if (!childrenMap[e.source_node_id]) childrenMap[e.source_node_id] = [];
            childrenMap[e.source_node_id].push(e.target_node_id);
            childIds[e.target_node_id] = true;
            hasTree = true;
        }
    });
    var levels = [], seen = {};
    if (hasTree) {
        var queue = nodes.filter(function (n) { return !childIds[n.node_id]; })
            .map(function (n) { return { n: n, d: 0 }; });
        while (queue.length) {
            var cur = queue.shift();
            if (seen[cur.n.node_id]) continue;
            seen[cur.n.node_id] = true;
            (levels[cur.d] = levels[cur.d] || []).push(cur.n);
            (childrenMap[cur.n.node_id] || []).forEach(function (cid) {
                if (byId[cid] && !seen[cid]) queue.push({ n: byId[cid], d: cur.d + 1 });
            });
        }
        var orphanDepth = levels.length; // unreached/orphan nodes must not disappear
        nodes.forEach(function (n) {
            if (!seen[n.node_id]) (levels[orphanDepth] = levels[orphanDepth] || []).push(n);
        });
    } else {
        levels.push([nodes[0]]);
        for (var fi = 1; fi < nodes.length; fi += 3) levels.push(nodes.slice(fi, fi + 3));
    }
    var maxD = levels.length - 1;
    var rowGap = maxD > 0 ? Math.min(120, (H - 150) / maxD) : 0;
    var subOff = Math.min(104, rowGap || 104);
    var positions = {};
    levels.forEach(function (lvl, d) {
        var y = 56 + d * rowGap;
        for (var c = 0; c < lvl.length; c += 4) {
            var chunk = lvl.slice(c, c + 4);
            var bw = chunk.length >= 4 ? 180 : chunk.length === 3 ? 205 : 235;
            var m = 80, span = W - 2 * m;
            chunk.forEach(function (n, k) {
                var x = m + (span * (k + 0.5)) / chunk.length;
                var label = (n.label && String(n.label).trim()) || 'Item';
                var lines = evWrap(label, chunk.length >= 4 ? 20 : 26, 3);
                positions[n.node_id] = { x: x, y: y, w: bw, h: Math.max(44, 18 + lines.length * 14), lines: lines };
            });
            y += subOff;
        }
    });
    var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg">' + EV_DEFS;
    Object.keys(childrenMap).forEach(function (pid) {
        var p = positions[pid];
        if (!p) return;
        childrenMap[pid].forEach(function (cid) {
            var ch = positions[cid];
            if (!ch) return;
            var midY = p.y + p.h + Math.max(8, (ch.y - (p.y + p.h)) / 2);
            svg += '<path d="M ' + p.x + ' ' + (p.y + p.h) + ' L ' + p.x + ' ' + midY
                + ' L ' + ch.x + ' ' + midY + ' L ' + ch.x + ' ' + (ch.y - 5)
                + '" fill="none" stroke="' + EV_EDGE + '" stroke-width="1.25" marker-end="url(#evArr)"/>';
        });
    });
    if (!hasTree && levels[1]) { // fallback connectors carry NO hierarchy semantics
        var root = positions[nodes[0].node_id];
        levels[1].forEach(function (n) {
            var ch = positions[n.node_id];
            if (!root || !ch) return;
            svg += '<line x1="' + root.x + '" y1="' + (root.y + root.h) + '" x2="' + ch.x + '" y2="' + (ch.y - 4)
                + '" stroke="rgba(244,239,228,0.16)" stroke-width="1"/>';
        });
    }
    Object.keys(positions).forEach(function (nid) {
        var p = positions[nid];
        svg += '<g class="ev-node">';
        svg += evBox(p.x - p.w / 2, p.y, p.w, p.h, 'rgba(244,239,228,0.08)', hasTree ? 'rgba(29,158,117,0.55)' : 'rgba(244,239,228,0.3)');
        svg += evLines(p.x, p.y + p.h / 2 - ((p.lines.length - 1) * 14) / 2 + 4, p.lines, 10.5, EV_TEXT, 14);
        svg += '</g>';
    });
    if (!hasTree) {
        svg += '<text x="16" y="' + (H - 10) + '" font-size="8.5" fill="rgba(244,239,228,0.4)">Arrangement follows content order; source does not define explicit hierarchy.</text>';
    }
    svg += '</svg>';
    return svg;
}

function renderCycleSVG(nodes, compsById) {
    var W = 900, H = 460, cx = 450, cy = 245, R = 145;
    var n = nodes.length;
    var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg">' + EV_DEFS;
    var pts = nodes.map(function (nd, i) {
        var a = n === 1 ? 0 : (-Math.PI / 2 + (2 * Math.PI * i) / n);
        return { x: n === 1 ? cx : cx + R * Math.cos(a), y: n === 1 ? cy : cy + R * Math.sin(a), node: nd };
    });
    function arrow(a, b) { // arrows drawn BEFORE circles so nodes sit above them
        var dx = b.x - a.x, dy = b.y - a.y, len = Math.sqrt(dx * dx + dy * dy) || 1;
        var ux = dx / len, uy = dy / len, off = n === 2 ? 42 : 34;
        svg += '<line x1="' + (a.x + ux * off) + '" y1="' + (a.y + uy * off)
            + '" x2="' + (b.x - ux * (off + 7)) + '" y2="' + (b.y - uy * (off + 7))
            + '" stroke="rgba(29,158,117,0.55)" stroke-width="1.5" marker-end="url(#evArrT)"/>';
    }
    if (n === 2) { arrow(pts[0], pts[1]); arrow(pts[1], pts[0]); }
    else if (n > 2) { for (var ai = 0; ai < n; ai++) arrow(pts[ai], pts[(ai + 1) % n]); }
    pts.forEach(function (p, i) {
        var label = (p.node.label && String(p.node.label).trim()) || ('Stage ' + (i + 1));
        var lines = evWrap(label, n <= 5 ? 22 : 16, 3);
        svg += '<g class="ev-node">';
        svg += '<circle cx="' + p.x + '" cy="' + p.y + '" r="26" fill="rgba(29,158,117,0.15)" stroke="' + EV_TEAL + '" stroke-width="1.5"/>';
        svg += '<text x="' + p.x + '" y="' + (p.y + 4) + '" text-anchor="middle" fill="' + EV_TEXT + '" font-size="12">' + (i + 1) + '</text>';
        svg += '</g>';
        var tx, anchor;
        if (n === 1) { tx = p.x; anchor = 'middle'; }
        else if (p.x < cx - 70) { anchor = 'end'; }
        else if (p.x > cx + 70) { anchor = 'start'; }
        else anchor = 'middle';
        if (anchor === 'end') tx = p.x - 36;
        else if (anchor === 'start') tx = p.x + 36;
        else tx = p.x;
        var ty;
        if (n !== 1 && p.y < cy - 40) ty = p.y - 38 - (lines.length - 1) * 12;
        else if (n !== 1 && p.y > cy + 40) ty = p.y + 44 + 14;
        else ty = p.y + 4 + (anchor === 'middle' ? 40 : -(lines.length - 1) * 6);
        svg += evLines(tx, ty, lines, 10.5, EV_TEXT, 12, anchor);
    });
    svg += '</svg>';
    return svg;
}

async function generateAnimation(idx, topic) {
    const res = await authFetch(API + '/animations/plan', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ topic: topic.title, description: topic.description || '' }),
    });
    if (!res.ok) await apiError(res);
    const data = await res.json();
    renderAnimationBlueprint(idx, data.data || data);
}

    }

    area.innerHTML =
        '<div class="ae-wrap" id="ae-wrap-' + idx + '">' +
        '  <div class="ae-stage" id="ae-stage-' + idx + '"></div>' +
        '  <div class="ae-caption" id="ae-cap-' + idx + '" style="display:none;"><span id="ae-captxt-' + idx + '"></span></div>' +
        '  <div class="ae-inspector" id="ae-insp-' + idx + '">' +
        '    <button class="ae-i-close" onclick="aeCloseInspector(' + idx + ')">&#10005;</button>' +
        '    <div id="ae-inspbody-' + idx + '"></div>' +
        '  </div>' +
        '  <div class="ae-hud">' +
        '    <div class="ae-progress" id="ae-prog-' + idx + '" onclick="aeSeekClick(event,' + idx + ')"><div class="ae-progress-fill" id="ae-fill-' + idx + '"></div></div>' +
        '    <div class="ae-controls">' +
        '      <button class="ae-btn primary" id="ae-play-' + idx + '" onclick="aeTogglePlay(' + idx + ')">&#10074;&#10074; Pause</button>' +
        '      <button class="ae-btn" onclick="aeRestart(' + idx + ')">&#8635; Replay</button>' +
        '      <button class="ae-btn" onclick="aeSetSpeed(' + idx + ',0.5)">0.5&times;</button>' +
        '      <button class="ae-btn" onclick="aeSetSpeed(' + idx + ',1)" id="ae-s1-' + idx + '" style="border-color:var(--amber);color:var(--amber);">1&times;</button>' +
        '      <button class="ae-btn" onclick="aeSetSpeed(' + idx + ',2)">2&times;</button>' +
        '      <span id="ae-chips-' + idx + '" style="display:flex;gap:4px;overflow-x:auto;"></span>' +
        '      <span class="ae-time" id="ae-time-' + idx + '">0.0s</span>' +
        '    </div>' +
        '  </div>' +
        '</div>';

    const engine = aeBuildEngine(idx, blueprint, topics[idx]);
