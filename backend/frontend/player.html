}

function aeSlugLabel(id) {
    return (id || '')
        .replace(/^comp_\d+_/, '')
        .replace(/[_-]+/g, ' ')
        .trim()
        .replace(/\b\w/g, c => c.toUpperCase()) || 'Component';
}

function aeExtractComponents(blueprint) {
    const ids = [];
    const seen = {};
    (blueprint.timeline.scenes || []).forEach(sc => (sc.events || []).forEach(ev => {
        const t = ev.target_id || '';
        if (t.indexOf('comp_') === 0 && !seen[t]) { seen[t] = true; ids.push(t); }
    }));
    (blueprint.classification && blueprint.classification.focus_order || []).forEach(t => {
        if (t && t.indexOf('comp_') === 0 && !seen[t]) { seen[t] = true; ids.push(t); }
    });
    return ids;
}

function aeComputeLayout(ids, category, W, H) {
    const n = ids.length;
    const pos = {};
    const cat = (category || '').toLowerCase();
    if (n === 1) {
        pos[ids[0]] = { x: W / 2, y: H / 2 };
    } else if (cat.includes('flow') || cat.includes('pipeline') || cat.includes('sequential') || cat.includes('timeline')) {
        ids.forEach((id, i) => { pos[id] = { x: (W / (n + 1)) * (i + 1), y: H * (i % 2 === 0 ? 0.38 : 0.66) }; });
    } else if (cat.includes('cycle') || cat.includes('loop')) {
        const R = Math.min(W, H) * 0.32;
        ids.forEach((id, i) => {
            const a = (2 * Math.PI * i) / n - Math.PI / 2;
            pos[id] = { x: W / 2 + R * Math.cos(a), y: H / 2 + R * Math.sin(a) };
        });
    } else if (n <= 4) {
        const spots = [[W*0.5,H*0.5],[W*0.22,H*0.3],[W*0.78,H*0.32],[W*0.5,H*0.8]];
        ids.forEach((id, i) => { pos[id] = { x: spots[i][0], y: spots[i][1] }; });
    } else {
        const hub = ids[0];
        pos[hub] = { x: W / 2, y: H / 2 };
        const sat = ids.slice(1);
        const R = Math.min(W, H) * 0.36;
        sat.forEach((id, i) => {
            const a = (2 * Math.PI * i) / sat.length - Math.PI / 2;
            pos[id] = { x: W / 2 + R * Math.cos(a), y: H / 2 + R * Math.sin(a) };
        });
    }
    return pos;
}

function aeBuildEngine(idx, blueprint, topic) {
    const wrap = document.getElementById('ae-wrap-' + idx);
    const stage = document.getElementById('ae-stage-' + idx);
    const scenes = blueprint.timeline.scenes || [];
    const classification = blueprint.classification || {};
    const compIds = aeExtractComponents(blueprint);
    const W = wrap.clientWidth || 900, H = Math.max(wrap.clientHeight || 0, 340);

    const pos = aeComputeLayout(compIds, classification.layout_category, W, H);
    const isHubLayout = compIds.length > 4;

    // Build nodes
    stage.innerHTML = '';
    const nodeEls = {};
    compIds.forEach((id, i) => {
        const el = document.createElement('div');
        el.className = 'ae-node' + ((isHubLayout && i === 0) ? ' hub' : '');
        el.style.left = pos[id].x + 'px';
        el.style.top = pos[id].y + 'px';
        el.onclick = () => aeInspect(idx, id);
        el.innerHTML = '<div class="ae-nlabel">' + escHtml(aeSlugLabel(id)) + '</div>' +
                       '<div class="ae-nsub">tap to explain</div>';
        stage.appendChild(el);
        nodeEls[id] = el;
    });

    // Edges: hub spokes or sequential flow
    let edges = [];
    if (isHubLayout && compIds.length > 1) {
        edges = compIds.slice(1).map(c => [compIds[0], c]);
    } else if (compIds.length > 1) {
        for (let i = 0; i < compIds.length - 1; i++) edges.push([compIds[i], compIds[i + 1]]);
    }
    const svgNS = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(svgNS, 'svg');
    svg.setAttribute('class', 'ae-edges');
    const edgeEls = [];
    edges.forEach(([a, b]) => {
        const line = document.createElementNS(svgNS, 'line');
        line.setAttribute('class', 'ae-edge');
        line.setAttribute('x1', pos[a].x); line.setAttribute('y1', pos[a].y);
        line.setAttribute('x2', pos[b].x); line.setAttribute('y2', pos[b].y);
        line.setAttribute('stroke', 'rgba(242,166,35,0.7)');
        line.setAttribute('stroke-width', '1.6');
        svg.appendChild(line);
        const dot = document.createElementNS(svgNS, 'circle');
        dot.setAttribute('class', 'ae-particle');
        dot.setAttribute('r', '3.4');
        svg.appendChild(dot);
        edgeEls.push({ line, dot, a, b });
    });
    stage.insertBefore(svg, stage.firstChild);

    // Scene chips
    const chipsEl = document.getElementById('ae-chips-' + idx);
    chipsEl.innerHTML = '';
    const sceneStarts = [];
    let acc = 0;
    scenes.forEach(sc => { sceneStarts.push(acc); acc += sc.duration_ms || 2000; });
    scenes.forEach((sc, si) => {
        const chip = document.createElement('span');
        chip.className = 'ae-scene-chip';
        chip.textContent = (si + 1) + '. ' + (sc.title || 'Scene').substring(0, 26);
        chip.onclick = () => aeSeek(idx, sceneStarts[si]);
        chipsEl.appendChild(chip);
    });

    // Progress ticks
    const prog = document.getElementById('ae-prog-' + idx);
    prog.querySelectorAll('.ae-tick').forEach(t => t.remove());
    const total = acc || 4000;
    sceneStarts.forEach(ms => {
        const tickEl = document.createElement('div');
        tickEl.className = 'ae-tick';
        tickEl.style.left = (ms / total * 100) + '%';
        tickEl.onclick = (e) => { e.stopPropagation(); aeSeek(idx, ms); };
        prog.appendChild(tickEl);
    });

    // Explanation map for click-to-inspect
    const explanations = aeBuildExplanations(blueprint, topic, compIds);

    // Flatten events with absolute times
    const events = [];
    scenes.forEach((sc, si) => (sc.events || []).forEach(ev => {
        events.push({ at: ev.timestamp_ms || sceneStarts[si], sceneIndex: si, ev });
    }));
    events.sort((a, b) => a.at - b.at);

    // Narration cues
    const cues = [];
    scenes.forEach((sc, si) => (sc.events || []).forEach(ev => {
        if (ev.narration_cue) cues.push({ start: ev.narration_cue.start_ms ?? ev.timestamp_ms ?? 0, end: ev.narration_cue.end_ms ?? 0, text: ev.narration_cue.text_emphasis || '', keyword: ev.narration_cue.keyword || '' });
    }));

    return {
        idx, blueprint, scenes, sceneStarts, total,
        compIds, pos, nodeEls, edgeEls, events, cues, explanations,
        classification,
        t: 0, playing: true, speed: 1, lastTs: null, raf: null,
        fired: {}, currentScene: -1, revealedCount: 0,
        stage, wrap,
    };
}

function aeBuildExplanations(blueprint, topic, compIds) {
    const exp = {};
    const sentences = (topic.description || '')
        .split(/(?<=[.!?])\s+|\n+/).map(s => s.trim()).filter(s => s.length > 15);

    compIds.forEach(id => {
        const label = aeSlugLabel(id);
        const words = label.toLowerCase().split(/\s+/).filter(w => w.length > 3);
        const parts = [];

        // 1. Narration cues aimed at this component
        (blueprint.timeline.scenes || []).forEach((sc, si) => (sc.events || []).forEach(ev => {
            if (ev.target_id === id && ev.narration_cue && ev.narration_cue.text_emphasis) {
                parts.push({ text: ev.narration_cue.text_emphasis, src: 'Scene ' + (si + 1) });
            }
        }));

        // 2. Best-matching sentences from the concept text
        const scored = sentences.map(s => {
            const low = s.toLowerCase();
            let score = 0;
            words.forEach(w => { if (low.includes(w)) score += 2; });
            if (low.includes(label.toLowerCase())) score += 4;
            return { s, score };
        }).filter(x => x.score > 0).sort((a, b) => b.score - a.score).slice(0, 2);
        scored.forEach(x => parts.push({ text: x.s, src: 'Concept text' }));

        // 3. Scene titles where it appears
        const sceneNums = [];
        (blueprint.timeline.scenes || []).forEach((sc, si) => {
            if ((sc.events || []).some(ev => ev.target_id === id)) sceneNums.push(si + 1);
        });

        exp[id] = {
            label,
            role: (id.indexOf('comp_1') === 0) ? 'Core concept' : 'Supporting component',
            parts: parts.length ? parts : [{ text: 'Part of the ' + (topic.title || 'concept') + ' visual model. Watch how it interacts with the other components in the flow.', src: 'Auto summary' }],
            scenes: sceneNums,
        };
    });
    return exp;
}

function aeInspect(idx, compId) {
    const eng = window['_ae_' + idx];
    if (!eng) return;
    const x = eng.explanations[compId];
    if (!x) return;
    const body = document.getElementById('ae-inspbody-' + idx);
    body.innerHTML =
        '<h4>' + escHtml(x.label) + '</h4>' +
        '<div class="ae-i-kicker">' + escHtml(x.role) + '</div>' +
        x.parts.map(p =>
            '<p>' + escHtml(p.text) + '<br><span class="ae-i-scenes" style="opacity:.75;">&mdash; ' + escHtml(p.src) + '</span></p>'
        ).join('') +
        (x.scenes.length ? '<p class="ae-i-scenes">&#9654; Appears in scene ' + x.scenes.join(', ') + '</p>' : '');
    document.getElementById('ae-insp-' + idx).classList.add('open');

    Object.keys(eng.nodeEls).forEach(k => eng.nodeEls[k].classList.toggle('inspected', k === compId));
    aeSyncRuntime(eng, eng.currentScene, null, compId);
}

function aeCloseInspector(idx) {
    const panel = document.getElementById('ae-insp-' + idx);
    if (panel) panel.classList.remove('open');
    const eng = window['_ae_' + idx];
    if (eng) Object.values(eng.nodeEls).filter(Boolean).forEach(el => el.classList.remove('inspected'));
}

function aeFireEvent(eng, item) {
    const { ev } = item;
    const type = ev.event_type || '';
    const target = ev.target_id || '';
    const md = ev.motion_definition || {};

    if (type === 'reveal_component' && eng.nodeEls[target]) {
        eng.nodeEls[target].classList.add('revealed');
        eng.revealedCount++;
        // light up edges whose both ends are visible
        eng.edgeEls.forEach(e => {
            if (eng.nodeEls[e.a].classList.contains('revealed') && eng.nodeEls[e.b].classList.contains('revealed')) {
                e.line.classList.add('on'); e.dot.classList.add('on');
                const x1 = eng.pos[e.a].x, y1 = eng.pos[e.a].y, x2 = eng.pos[e.b].x, y2 = eng.pos[e.b].y;
                e.dot.setAttribute('cx', x1); e.dot.setAttribute('cy', y1);
                const path = 'path("M ' + x1 + ' ' + y1 + ' L ' + x2 + ' ' + y2 + '")';
                e.dot.style.offsetPath = path;
                try { e.dot.style.motionPath = path; } catch (err) {}
            }
        });
    } else if (type === 'highlight_node' && eng.nodeEls[target]) {
        const el = eng.nodeEls[target];
        el.style.setProperty('--glow', md.glow_color || 'var(--amber)');
        el.classList.remove('glowing');
        void el.offsetWidth;
        const pulses = Math.max(1, Math.min(3, parseInt(md.pulse_count) || 1));
        el.style.setProperty('--pulse-n', pulses);
        el.style.animationIterationCount = pulses;
        el.classList.add('glowing');
        setTimeout(() => el.classList.remove('glowing'), 1000 * pulses);
    } else if (type === 'focus_camera') {
        if (target === 'canvas_overview' || !eng.nodeEls[target]) {
            eng.stage.style.transform = 'scale(1)';
        } else {
            const p = eng.pos[target];
            const zoom = Math.min(1.55, Math.max(1.12, (md.zoom || 1.35)));
            const dx = (eng.wrap.clientWidth / 2 - p.x) * zoom;
            const dy = (eng.wrap.clientHeight / 2 - p.y) * zoom;
            eng.stage.style.transform = 'translate(' + dx + 'px,' + dy + 'px) scale(' + zoom + ')';
        }
    }
}

function aeUpdateCaption(eng) {
    const cap = document.getElementById('ae-cap-' + eng.idx);
    const txt = document.getElementById('ae-captxt-' + eng.idx);
    const cue = eng.cues.find(c => eng.t >= c.start && eng.t < (c.end || c.start + 1800));
    if (cue && cue.text) {
        cap.style.display = 'flex';
        const shown = cue.text.substring(0, Math.floor((eng.t - cue.start) / 28));
        const kw = cue.keyword;
        if (kw && shown.toLowerCase().includes(kw.toLowerCase())) {
            const i = shown.toLowerCase().indexOf(kw.toLowerCase());
            txt.innerHTML = escHtml(shown.substring(0, i)) + '<b>' + escHtml(shown.substring(i, i + kw.length)) + '</b>' + escHtml(shown.substring(i + kw.length)) + '&#9608;';
        } else {
            txt.innerHTML = escHtml(shown) + '&#9608;';
        }
    } else {
        cap.style.display = 'none';
    }
}

function aeApplyAll(eng) {
    eng.events.forEach(item => { if (item.at <= eng.t) aeFireEvent(eng, item); });
}

function aeSceneAt(eng) {
    let si = 0;
    eng.sceneStarts.forEach((ms, i) => { if (eng.t >= ms) si = i; });
    return si;
}

function aeSyncRuntime(eng, sceneIndex, eventId, componentId) {
    // Best-effort sync with existing animation runtime endpoint
    try {
        authFetch(API + '/animations/runtime/sync', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                session_id: 'ae_' + eng.idx + '_' + Date.now(),
                blueprint_id: eng.blueprint.blueprint_id,
                scene_index: sceneIndex,
                event_id: eventId || null,
                component_id: componentId || null,
            }),
        }).catch(() => {});
    } catch (e) { /* non-critical */ }
}

let _lastSync = 0;
function aeLoop(ts) {
    if (typeof ts !== 'number') { requestAnimationFrame(aeLoop); return; }
    const engs = Object.keys(window).filter(k => k.indexOf('_ae_') === 0);
    engs.forEach(k => {
        const eng = window[k];
        if (!eng || !eng.playing) return;
        if (!document.body.contains(eng.stage)) { delete window[k]; return; }
        if (typeof eng.lastTs !== 'number' || !isFinite(eng.t)) { eng.lastTs = ts; requestAnimationFrame(aeLoop); return; }
        const dt = (ts - eng.lastTs) * eng.speed;
        eng.lastTs = ts;
        eng.t += dt;

        eng.events.forEach(item => {
            if (item.at <= eng.t && !eng.fired[item.ev.event_id || item.at]) {
                eng.fired[item.ev.event_id || item.at] = true;
                aeFireEvent(eng, item);
            }
        });

        const si = aeSceneAt(eng);
        if (si !== eng.currentScene) {
            eng.currentScene = si;
            const chips = document.getElementById('ae-chips-' + eng.idx);
            if (chips) chips.querySelectorAll('.ae-scene-chip').forEach((c, i) => c.classList.toggle('active', i === si));
            if (Date.now() - _lastSync > 1500) { _lastSync = Date.now(); aeSyncRuntime(eng, si, null, null); }
        }

        const fill = document.getElementById('ae-fill-' + eng.idx);
        if (fill) fill.style.width = Math.min(100, eng.t / eng.total * 100) + '%';
        const timeEl = document.getElementById('ae-time-' + eng.idx);
        if (timeEl) timeEl.textContent = (Math.min(eng.t, eng.total) / 1000).toFixed(1) + 's / ' + (eng.total / 1000).toFixed(1) + 's';
        aeUpdateCaption(eng);

        if (eng.t >= eng.total) {
            eng.playing = false;
            eng.t = eng.total;
            const btn = document.getElementById('ae-play-' + eng.idx);
            if (btn) btn.innerHTML = '&#8635; Replay';
        }
    });
    requestAnimationFrame(aeLoop);
}
requestAnimationFrame(aeLoop);

function aeTogglePlay(idx) {
    const eng = window['_ae_' + idx];
    if (!eng) return;
    const btn = document.getElementById('ae-play-' + idx);
    if (!eng.playing && eng.t >= eng.total) { aeRestart(idx); return; }
    eng.playing = !eng.playing;
    eng.lastTs = null;
    if (btn) btn.innerHTML = eng.playing ? '&#10074;&#10074; Pause' : '&#9654; Play';
}

function aeRestart(idx) {
    const eng = window['_ae_' + idx];
    if (!eng) return;
    eng.t = 0; eng.fired = {}; eng.currentScene = -1; eng.playing = true; eng.lastTs = null;
    Object.values(eng.nodeEls).filter(Boolean).forEach(el => el.classList.remove('revealed', 'glowing'));
    eng.edgeEls.forEach(e => { e.line.classList.remove('on'); e.dot.classList.remove('on'); });
    eng.stage.style.transform = 'scale(1)';
    const btn = document.getElementById('ae-play-' + idx);
    if (btn) btn.innerHTML = '&#10074;&#10074; Pause';
}

function aeSeek(idx, ms) {
    const eng = window['_ae_' + idx];
    if (!eng) return;
    eng.t = Math.max(0, Math.min(ms, eng.total - 10));
    eng.fired = {}; eng.currentScene = -1; eng.lastTs = null;
    Object.values(eng.nodeEls).filter(Boolean).forEach(el => el.classList.remove('revealed', 'glowing'));
    eng.edgeEls.forEach(e => { e.line.classList.remove('on'); e.dot.classList.remove('on'); });
    eng.stage.style.transform = 'scale(1)';
    aeApplyAll(eng);
    if (!eng.playing) { eng.playing = true; const btn = document.getElementById('ae-play-' + idx); if (btn) btn.innerHTML = '&#10074;&#10074; Pause'; }
}

function aeSeekClick(event, idx) {
    const eng = window['_ae_' + idx];
    if (!eng) return;
    const rect = event.currentTarget.getBoundingClientRect();
    const frac = (event.clientX - rect.left) / rect.width;
    aeSeek(idx, frac * eng.total);
}

function aeSetSpeed(idx, s) {
    const eng = window['_ae_' + idx];
    if (!eng) return;
    eng.speed = s; eng.lastTs = null;
    [0.5, 1, 2].forEach(v => {
        const b = document.getElementById('ae-s' + String(v).replace('.', '') + '-' + idx);
        if (b) { b.style.borderColor = v === s ? 'var(--amber)' : ''; b.style.color = v === s ? 'var(--amber)' : ''; }
    });
}

async function generateVideo(idx, topic) {
    const area = document.getElementById('va-' + idx);
    if (!area) return;
    area.innerHTML = '<div class="visual-loading"><div class="spinner"></div><div>Rendering video (~15s)&hellip;</div></div>';
    const res = await authFetch(API + '/videos/create', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ topic: topic.title, description: topic.description || '' }),
    });
    if (!res.ok) await apiError(res);
    const data = await res.json();
    renderVideoProject(idx, data.data || data);
}

function renderVideoProject(idx, project) {
    const area = document.getElementById('va-' + idx);
    if (!area) return;
    const title = project.title || project.topic || topics[idx].title;
    const playableUrl = project.playable_url;
    const status = project.rendering_status || 'unknown';
    const durationMs = project.timeline?.total_duration_ms || 0;
    const sceneCount = project.storyboard?.total_scenes || project.timeline?.scene_count || 0;
    const storyboardScenes = project.storyboard?.scenes || [];

    let html = '<div style="padding:1.25rem;width:100%;">';

    if (playableUrl) {
        html += '<video id="vid-' + idx + '" controls preload="metadata" style="width:100%;max-height:420px;border-radius:2px;background:#000;">';
        html += '<source src="' + escHtml(playableUrl) + '" type="video/mp4">';
        html += 'Your browser does not support video.';
        html += '</video>';
        const rates = [0.5, 0.75, 1, 1.25, 1.5, 2];
        html += '<div style="margin-top:.5rem;display:flex;gap:6px;align-items:center;flex-wrap:wrap;">';
        html += '<span style="font-size:.72rem;color:var(--muted);">Speed:</span>';
        html += rates.map(r =>
            '<button class="ae-btn vspeed-btn" data-rate="' + r + '" onclick="setVideoSpeed(' + idx + ',' + r + ')">' + r + '&times;</button>'
        ).join('');
        html += '</div>';
    } else {
        html += '<div style="border:1px solid var(--coral);border-radius:3px;padding:2rem;text-align:center;">';
        html += '<p style="color:var(--coral);">Video render ' + escHtml(status) + '. No playable URL available.</p>';
        html += '</div>';
    }

    html += '<div style="margin-top:.75rem;display:flex;justify-content:space-between;align-items:center;">';
    html += '<span style="font-size:.78rem;color:#F2A623;font-family:Space Grotesk,sans-serif;">' + escHtml(title) + '</span>';
    html += '<span style="font-size:.72rem;color:var(--muted);">' + (durationMs/1000).toFixed(0) + 's &middot; ' + sceneCount + ' scenes</span>';
    html += '</div>';

    if (storyboardScenes.length > 0) {
        html += '<div style="margin-top:.75rem;max-height:140px;overflow-y:auto;">';
        storyboardScenes.forEach((scene, si) => {
            const narrText = scene.narration_cue?.text_emphasis || scene.learning_objective || '';
            html += '<div style="display:flex;gap:8px;align-items:baseline;padding:4px 0;border-bottom:1px solid var(--line);">';
            html += '<span style="color:#F2A623;font-family:Space Grotesk,sans-serif;font-size:.72rem;min-width:18px;">' + (si + 1) + '</span>';
            html += '<span style="font-size:.78rem;">' + escHtml((scene.title || '').substring(0, 60)) + '</span>';
            if (narrText) html += '<span style="font-size:.72rem;color:var(--muted);margin-left:auto;">' + escHtml(narrText.substring(0, 40)) + '</span>';
            html += '</div>';
        });
        html += '</div>';
    }

    html += '</div>';
    area.innerHTML = html;
    applyVideoSpeed(idx);
    cacheVisual(idx, html, function () { applyVideoSpeed(idx); });
}

// Default video playback speed is 0.5x (learning pace); the chosen speed is
// kept per topic so navigating away and back does not reset it.
function applyVideoSpeed(idx) {
    const v = document.getElementById('vid-' + idx);
    if (!v) return;
    if (window['_vspeed_' + idx] === undefined) window['_vspeed_' + idx] = 0.5;
    v.playbackRate = window['_vspeed_' + idx];
    document.querySelectorAll('#va-' + idx + ' .vspeed-btn').forEach(b => {
        const active = parseFloat(b.dataset.rate) === window['_vspeed_' + idx];
        b.style.borderColor = active ? 'var(--amber)' : '';
        b.style.color = active ? 'var(--amber)' : '';
    });
}

function setVideoSpeed(idx, rate) {
    window['_vspeed_' + idx] = rate;
    applyVideoSpeed(idx);
}

async function generateSimulation(idx, topic) {
    const area = document.getElementById('va-' + idx);
    if (!area) return;
    area.innerHTML = '<div class="visual-loading"><div class="spinner"></div><div>Loading simulations&hellip;</div></div>';
    const defsRes = await authFetch(API + '/simulations/definitions');
    if (!defsRes.ok) throw new Error('Failed to fetch simulations');
    const defsData = await defsRes.json();
    const defs = defsData.data || [];

    if (defs.length === 0) {
        area.innerHTML = '<div class="visual-error">No simulations available yet.</div>';
        return;
    }

    const topicLower = (topic.title + ' ' + (topic.description || '')).toLowerCase();
    let bestIdx = 0, bestScore = 0;
    defs.forEach((d, i) => {
        const simText = (d.topic + ' ' + (d.description || '') + ' ' + (d.category || '')).toLowerCase();
        let score = 0;
        topicLower.split(/\s+/).filter(w => w.length > 3).forEach(w => { if (simText.includes(w)) score += 2; });
        if (score > bestScore) { bestScore = score; bestIdx = i; }
    });

    let html = '<div style="padding:1.25rem;width:100%;">';
    html += '<p style="font-size:.78rem;color:#F2A623;font-family:Space Grotesk,sans-serif;margin-bottom:.75rem;">Simulations (' + defs.length + ')</p>';
    if (defs.length > 1) {
        html += '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:.75rem;">';
        defs.forEach((d, i) => {
            html += '<button class="icon-btn sim-pick" data-sim-idx="' + i + '" onclick="pickSimulation(' + idx + ',' + i + ')" style="' + (i === bestIdx ? 'border-color:var(--amber);color:var(--paper);' : '') + '">' + escHtml(d.topic.substring(0, 30)) + '</button>';
        });
        html += '</div>';
    }
    html += '<div id="sim-session-' + idx + '"></div></div>';
    area.innerHTML = html;
    window['_simDefs'] = defs;
    await startSimulationSession(idx, bestIdx);
}

async function pickSimulation(topicIdx, simIdx) {
    document.querySelectorAll('.sim-pick').forEach(b => { b.style.borderColor = ''; b.style.color = ''; });
    const btn = document.querySelector('.sim-pick[data-sim-idx="' + simIdx + '"]');
    if (btn) { btn.style.borderColor = 'var(--amber)'; btn.style.color = 'var(--paper)'; }
    await startSimulationSession(topicIdx, simIdx);
}

async function startSimulationSession(idx, simIdx) {
    const defs = window['_simDefs'] || [];
    const def = defs[simIdx];
    if (!def) return;
    const sessRes = await authFetch(API + '/simulations/sessions/start', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ simulation_id: def.simulation_id || def.id }),
    });
    if (!sessRes.ok) throw new Error('Failed to start simulation');
    const sessData = await sessRes.json();
    const session = sessData.data || sessData;
    window['_sim_' + idx] = { sessionId: session.session_id, definition: session.definition || def, state: session.state };
    renderSimulationStep(idx);
}

function renderSimulationStep(idx) {
    const container = document.getElementById('sim-session-' + idx);
    if (!container) return;
    const sess = window['_sim_' + idx];
    if (!sess) return;
    const def = sess.definition;
    const state = sess.state;
    const steps = def.steps || [];
    const currentIdx = state?.current_step_index || state?.current_step || 0;
    const step = steps[currentIdx] || steps[0];
    const checkpoints = def.checkpoints || [];
    const learningObjs = def.learning_objectives || [];
    const params = def.parameters || [];

    let html = '';

    if (params.length > 0) {
        html += '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:.6rem;">';
        params.forEach(p => {
            html += '<span style="font-size:.72rem;padding:.2rem .5rem;border:1px solid var(--line);border-radius:2px;color:var(--muted);">';
            html += escHtml(p.label || p.parameter_id) + ': <strong style="color:var(--paper);">' + escHtml(String(p.current_value ?? p.default_value)) + '</strong>';
            html += '</span>';
        });
        html += '</div>';
    }

    if (step) {
        html += '<div style="border:1px solid var(--amber);border-radius:3px;padding:1rem;margin-bottom:.6rem;background:rgba(242,166,35,0.04);">';
        html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.4rem;">';
        html += '<span style="font-size:.85rem;font-weight:500;">' + escHtml(step.title || 'Step ' + (currentIdx + 1)) + '</span>';
        html += '<span style="font-size:.72rem;color:var(--muted);">Step ' + (currentIdx + 1) + ' of ' + steps.length + '</span></div>';
        html += '<p style="font-size:.85rem;color:var(--muted-strong);line-height:1.6;">' + escHtml(step.description || '') + '</p>';
        if (step.state_delta) {
            html += '<div style="margin-top:.5rem;display:flex;gap:4px;flex-wrap:wrap;">';
            Object.entries(step.state_delta).forEach(([k, v]) => {
                html += '<span style="font-size:.72rem;padding:.15rem .45rem;border:1px solid var(--line);border-radius:2px;color:var(--teal);">' + escHtml(k) + ': ' + escHtml(String(v).substring(0, 20)) + '</span>';
            });
            html += '</div>';
        }
        html += '</div>';
    }

    const cp = checkpoints.find(c => c.step_number === currentIdx + 1);
    if (cp) {
        html += '<div style="border:1px solid var(--teal);border-radius:3px;padding:.75rem 1rem;margin-bottom:.6rem;background:rgba(29,158,117,0.04);">';
        html += '<p style="font-size:.78rem;color:var(--teal);font-weight:500;margin-bottom:.25rem;">&#9733; ' + escHtml(cp.title) + '</p>';
        html += '<p style="font-size:.8rem;color:var(--muted-strong);">' + escHtml(cp.explanation) + '</p>';
        if (cp.hint) html += '<p style="font-size:.75rem;color:var(--muted);margin-top:.25rem;font-style:italic;">Hint: ' + escHtml(cp.hint) + '</p>';
        html += '</div>';
    }

    html += '<div style="display:flex;gap:8px;margin-top:.5rem;">';
    html += '<button class="icon-btn" onclick="simStep(' + idx + ',\'prev\')" ' + (currentIdx <= 0 ? 'disabled style="opacity:.35;"' : '') + '>&#9664; Prev</button>';
    html += '<button class="icon-btn" onclick="simStep(' + idx + ',\'next\')" ' + (currentIdx >= steps.length - 1 ? 'disabled style="opacity:.35;"' : '') + '>Next &#9654;</button>';
    html += '</div>';

    if (learningObjs.length > 0) {
        html += '<div style="margin-top:.6rem;">';
        html += '<p style="font-size:.72rem;color:var(--muted);margin-bottom:.25rem;">Learning objectives:</p>';
        learningObjs.forEach(obj => {
            html += '<p style="font-size:.75rem;color:var(--muted-strong);padding-left:.5rem;">&#8226; ' + escHtml(obj) + '</p>';
        });
        html += '</div>';
    }

    container.innerHTML = html;
}

async function simStep(idx, action) {
    const sess = window['_sim_' + idx];
    if (!sess || !sess.sessionId) return;
    const res = await authFetch(API + '/simulations/sessions/' + sess.sessionId + '/step', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action }),
    });
    if (!res.ok) return;
    const data = await res.json();
    sess.state = data.data?.state || data.data;
    sess.definition = data.data?.definition || sess.definition;
    renderSimulationStep(idx);
}

function showControls(idx, type) {
    const ctrl = document.getElementById('ctrl-' + idx);
    if (!ctrl) return;
    if (type === 'animation') {
        // Motion Engine v2 renders its own HUD controls inside the stage
        ctrl.style.display = 'none';
    } else {
        ctrl.style.display = 'flex';
        ctrl.innerHTML = '';
    }
}

// ── Quiz taking (P6) ────────────────────────────────────────────────────
let quizState = null;

function quizTypeLabel(t) {
    return (t === 'multiple_choice' || t === 'single_choice') ? 'Multiple choice'
        : (t === 'true_false') ? 'True / False'
        : (t === 'multiple_answer') ? 'Select all'
        : 'Question';
}

function closeQuiz() {
    document.getElementById('quizOverlay').classList.add('hidden');
    document.body.style.overflow = '';
    quizState = null;
}

async function startQuiz(quizId) {
    const ov = document.getElementById('quizOverlay');
    ov.classList.remove('hidden');
    document.body.style.overflow = 'hidden';
    document.getElementById('quizCard').innerHTML =
        '<div class="quiz-head"><div><h3>Checkpoint</h3><div class="quiz-sub">Starting your assessment&hellip;</div></div>' +
        '<button class="quiz-close" onclick="closeQuiz()">&#10005;</button></div>' +
        '<div class="quiz-body" style="display:flex;align-items:center;justify-content:center;min-height:200px;">' +
        '<div class="visual-loading"><div class="spinner"></div><div>Loading questions&hellip;</div></div></div>';

    quizState = { quizId, questions: [], answers: {}, current: 0, attemptId: null, startTime: Date.now() };
    try {
        const res = await authFetch(API + '/quizzes/' + quizId + '/attempts', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({}),
        });
        if (!res.ok) await apiError(res);
        const data = await res.json();
        const attempt = data.data || data;
        quizState.attemptId = attempt.attempt_id;
        quizState.attemptNumber = attempt.attempt_number || 1;
        quizState.quizId = attempt.quiz_id || quizState.quizId;
        quizState.questions = attempt.questions || [];
        if (!quizState.questions.length) {
            document.getElementById('quizCard').innerHTML =
                '<div class="quiz-head"><div><h3>Checkpoint</h3></div><button class="quiz-close" onclick="closeQuiz()">&#10005;</button></div>' +
                '<div class="quiz-body"><div class="visual-error">This checkpoint has no questions available.</div></div>';
            return;
        }
        renderQuizQuestion();
    } catch (e) {
        document.getElementById('quizCard').innerHTML =
            '<div class="quiz-head"><div><h3>Checkpoint</h3></div><button class="quiz-close" onclick="closeQuiz()">&#10005;</button></div>' +
            '<div class="quiz-body"><div class="visual-error">Failed to start checkpoint: ' + escHtml(e.message) + '</div></div>';
    }
}

function quizChoose(q, optId, inputEl) {
    const type = q.question_type;
    const sel = quizState.answers[q.id] || [];
    if (type === 'multiple_answer') {
        const i = sel.indexOf(optId);
        if (i >= 0) sel.splice(i, 1); else sel.push(optId);
        quizState.answers[q.id] = sel.slice();
        renderQuizOptions(q, sel);
    } else {
        quizState.answers[q.id] = [optId];
        renderQuizOptions(q, sel);
    }
}

function renderQuizOptions(q, sel) {
    q.options.forEach((opt) => {
        const id = 'qopt-' + q.id + '-' + opt.id;
        const el = document.getElementById(id);
        if (!el) return;
        el.classList.toggle('selected', sel.indexOf(opt.id) >= 0);
        const input = el.querySelector('input');
        if (input) input.checked = sel.indexOf(opt.id) >= 0;
    });
}

function renderQuizQuestion() {
    const q = quizState.questions[quizState.current];
    if (!q) return;
    const total = quizState.questions.length;
    const sel = quizState.answers[q.id] || [];
    const isMulti = q.question_type === 'multiple_answer';
    const inputType = isMulti ? 'checkbox' : 'radio';
    const name = 'q-' + q.id;

    const optHtml = q.options.map((opt, i) => {
        const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
        const label = q.question_type === 'true_false'
            ? (opt.position === 0 ? 'False' : 'True')
            : (letters[i] || (i + 1));
        return '<label class="quiz-opt' + (sel.indexOf(opt.id) >= 0 ? ' selected' : '') + '" id="qopt-' + q.id + '-' + opt.id + '">' +
            '<input type="' + inputType + '" name="' + name + '" ' + (sel.indexOf(opt.id) >= 0 ? 'checked' : '') + '>' +
            '<span class="q-opt-letter">' + label + '</span>' +
            '<span class="q-opt-text">' + escHtml(opt.text || '') + '</span></label>';
    }).join('');

    document.getElementById('quizCard').innerHTML =
        '<div class="quiz-head"><div><h3>Checkpoint ' + Math.min(quizState.attemptNumber || 1, 999) + '</h3>' +
        '<div class="quiz-sub">Question ' + (quizState.current + 1) + ' of ' + total + '</div></div>' +
        '<button class="quiz-close" onclick="closeQuiz()">&#10005;</button></div>' +
        '<div class="quiz-body">' +
        '<div class="quiz-progress">QUESTION ' + (quizState.current + 1) + ' / ' + total + '</div>' +
        '<div class="quiz-progress-bar"><div class="quiz-progress-fill" style="width:' + (((quizState.current + 1) / total) * 100) + '%;"></div></div>' +
        '<div class="quiz-qstem">' + escHtml(q.stem || '') + '</div>' +
        '<div class="quiz-qmeta"><span>' + escHtml(quizTypeLabel(q.question_type)) + '</span>' +
        (q.points ? '<span>' + q.points + ' pt' + (q.points > 1 ? 's' : '') + '</span>' : '') +
        (q.bloom_level ? '<span>' + escHtml(q.bloom_level) + '</span>' : '') + '</div>' +
        '<div class="quiz-options">' + optHtml + '</div>' +
        '</div>' +
        '<div class="quiz-foot">' +
        '<div class="quiz-nav">' +
        '<button class="icon-btn" onclick="quizNav(-1)" ' + (quizState.current <= 0 ? 'disabled' : '') + '>&#9664; Previous</button>' +
        '<button class="icon-btn" onclick="quizNav(1)" ' + (quizState.current >= total - 1 ? 'disabled' : '') + '>Next &#9654;</button>' +
        '</div>' +
        (quizState.current >= total - 1
            ? '<button class="lj-take" onclick="submitQuiz()">Submit Quiz</button>'
            : '<span style="font-size:.72rem;color:var(--muted);" onclick="submitQuiz()" class="lj-link">Submit early</span>') +
        '</div>';

    // Rebind onclick closures after innerHTML replace
    wireQuizOptions(q);
}

function wireQuizOptions(q) {
    q.options.forEach((opt) => {
        const el = document.getElementById('qopt-' + q.id + '-' + opt.id);
        if (!el) return;
        el.onclick = () => quizChoose(q, opt.id, el.querySelector('input'));
    });
}

function quizNav(dir) {
    const target = quizState.current + dir;
    if (target < 0 || target >= quizState.questions.length) return;
    quizState.current = target;
    renderQuizQuestion();
}

async function submitQuiz() {
    const answers = quizState.questions.map((q) => ({
        question_id: q.id,
        option_ids: quizState.answers[q.id] || [],
    }));
    const card = document.getElementById('quizCard');
    card.innerHTML =
        '<div class="quiz-head"><div><h3>Checkpoint</h3><div class="quiz-sub">Scoring your answers&hellip;</div></div>' +
        '<button class="quiz-close" onclick="closeQuiz()">&#10005;</button></div>' +
        '<div class="quiz-body" style="display:flex;align-items:center;justify-content:center;min-height:200px;">' +
        '<div class="visual-loading"><div class="spinner"></div><div>Scoring&hellip;</div></div></div>';
    try {
        const res = await authFetch(API + '/quizzes/' + quizState.quizId + '/attempts/' + quizState.attemptId + '/submit', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                answers,
                time_spent_seconds: Math.max(1, Math.round((Date.now() - quizState.startTime) / 1000)),
            }),
        });
        if (!res.ok) await apiError(res);
        const data = await res.json();
        const result = data.data || data;
        quizState.result = result;
        renderQuizResult(result);
        refreshLearnerJourney();
    } catch (e) {
        card.innerHTML =
            '<div class="quiz-head"><div><h3>Checkpoint</h3></div><button class="quiz-close" onclick="closeQuiz()">&#10005;</button></div>' +
            '<div class="quiz-body"><div class="visual-error">Failed to submit: ' + escHtml(e.message) + '</div></div>';
    }
}

function renderQuizResult(result) {
    const pct = result.percent_score != null ? Math.round(result.percent_score) : 0;
    const passed = !!result.passed;
    const sb = result.score_breakdown || {};

    const qf = result.question_feedback || [];
    const reviewHtml = qf.length ? '<div class="quiz-review"><p style="font-size:.78rem;color:var(--amber);margin-bottom:.6rem;">Detailed feedback</p>' +
        qf.map((fb) => {
            const q = quizState.questions.find((x) => x.id === fb.question_id);
            const correct = fb.is_correct;
            const marker = correct === true ? '&#10003;' : (correct === false ? '&#10007;' : '&#9654;');
            const markCls = correct === true ? 'color:var(--teal);' : (correct === false ? 'color:var(--coral);' : 'color:var(--muted);');
            return '<div style="padding:.5rem 0;border-bottom:1px solid var(--line);">' +
                '<div style="font-size:.82rem;color:var(--paper);">' + marker + ' <span style="' + markCls + '"></span>' + escHtml((q && q.stem) || 'Question ' + fb.position) + '</div>' +
                '<div style="font-size:.72rem;color:var(--muted);margin-top:.2rem;">' + escHtml((q && quizTypeLabel(q.question_type)) || '') +
                (q && q.points ? ' &middot; ' + fb.points_earned + ' / ' + fb.points_possible + ' pts' : '') + '</div>' +
                (fb.explanation ? '<div style="font-size:.78rem;color:var(--muted-strong);margin-top:.3rem;line-height:1.5;">' + escHtml(fb.explanation) + '</div>' : '') +
                '</div>';
        }).join('') + '</div>' : '';

    const recs = result.recommendations;
    let recHtml = '';
    if (recs && recs.next_action) {
        const na = recs.next_action;
        const cta = nextActionCta(na);
        recHtml = '<div style="margin-top:.9rem;border:1px solid var(--line);border-left:3px solid var(--amber);border-radius:3px;padding:.8rem 1rem;text-align:left;background:rgba(242,166,35,0.04);">' +
            '<div style="font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--amber);margin-bottom:.3rem;">Recommended next</div>' +
            '<div style="font-size:.92rem;color:var(--paper);font-weight:600;">' + escHtml(na.title || 'Revisit the topic') + '</div>' +
            (na.reason ? '<div style="font-size:.8rem;color:var(--muted-strong);margin-top:.25rem;line-height:1.5;">' + escHtml(na.reason) + '</div>' : '') +
            (cta ? '<div style="margin-top:.6rem;">' + cta + '</div>' : '') +
            '</div>';
    }

    document.getElementById('quizCard').innerHTML =
        '<div class="quiz-head"><div><h3>Checkpoint Complete</h3><div class="quiz-sub">Attempt ' + (result.attempt_number || 1) + '</div></div>' +
        '<button class="quiz-close" onclick="closeQuiz()">&#10005;</button></div>' +
        '<div class="quiz-body"><div class="quiz-result">' +
        '<div class="quiz-score-ring ' + (passed ? 'pass' : 'fail') + '">' + pct + '%</div>' +
        '<h3>' + (passed ? 'Checkpoint passed!' : 'Keep going') + '</h3>' +
        '<div class="quiz-result-sub">You scored <b>' + pct + '%</b>' +
        (result.passing_score != null ? ' &mdash; passing is ' + Math.round(result.passing_score) + '%' : '') + '</div>' +
        '<div class="quiz-result-actions">' +
        '<button class="lj-take" onclick="closeQuiz()">Back to Lesson</button>' +
        '</div></div>' +
        (recHtml) +
        '<div style="margin-top:.9rem;">' +
        '<div class="quiz-result-row"><span>Correct</span><b>' + (sb.correct_count != null ? sb.correct_count : '') + '</b></div>' +
        '<div class="quiz-result-row"><span>Incorrect</span><b>' + (sb.incorrect_count != null ? sb.incorrect_count : '') + '</b></div>' +
        '<div class="quiz-result-row"><span>Unanswered</span><b>' + (sb.unanswered_count != null ? sb.unanswered_count : '') + '</b></div>' +
        '</div>' +
        reviewHtml + '</div>';
}

async function refreshLearnerJourney() {
    learnerCompletion = 0;
    await loadLearnerJourney();
}

// NG-1: turn a structured next_action into a real, clickable CTA that resolves
// to a valid application destination. Returns '' (renders nothing) when the
// target data is missing so we never emit a dead button or dead link.
function nextActionCta(na) {
    if (!na) return '';
    const meta = (na.metadata && typeof na.metadata === 'object') ? na.metadata : {};
    const lessonPublicId = meta.lesson_id || resultLessonPublicId();
    let label = na.title || 'Review this concept';
    if (lessonPublicId) {
        return '<a class="lj-take" href="/frontend/player.html?lesson=' + encodeURIComponent(lessonPublicId) + '">' + escHtml(label) + '</a>';
    }
    if (na.concept_id) {
        return '<a class="lj-take" href="/frontend/tutor.html?concept=' + encodeURIComponent(na.concept_id) + '">' + escHtml(label) + '</a>';
    }
    return '';
}

function resultLessonPublicId() {
    const rl = quizState.result && quizState.result.lesson_id;
    return rl ? String(rl) : '';
}

// ── Utils ────────────────────────────────────────────────────────────────
function escHtml(s) {
    if (!s) return '';
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
}
function escSvg(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

init();
</script>
