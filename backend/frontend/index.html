<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>EduVision AI</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0E1A2B;--paper:#F4EFE4;--amber:#F2A623;--teal:#1D9E75;--line:rgba(244,239,228,0.14);--muted:rgba(244,239,228,0.55)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--ink);color:var(--paper);font-family:'Manrope',sans-serif;min-height:100vh;display:flex;flex-direction:column}
h1,h2,h3{font-family:'Space Grotesk',sans-serif}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:3rem 1.5rem;text-align:center}
.brand-mark{width:60px;height:60px;border-radius:14px;background:var(--amber);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--ink);font-family:'Space Grotesk',sans-serif;font-size:1.5rem;margin:0 auto 1.5rem}
h1{font-size:2.5rem;margin-bottom:.5rem}
p{color:var(--muted);font-size:1rem;max-width:440px;line-height:1.6;margin-bottom:2.5rem}
.actions{display:flex;gap:1rem;flex-wrap:wrap;justify-content:center}
.btn{padding:.8rem 2rem;border-radius:2px;font-family:'Space Grotesk',sans-serif;font-size:.95rem;font-weight:700;text-decoration:none;cursor:pointer;transition:transform .2s,background .2s;border:none}
.btn:active{transform:scale(.96)}
.btn-amber{background:var(--amber);color:var(--ink)}
.btn-amber:hover{background:#ffbf47}
.btn-teal{background:var(--teal);color:var(--ink)}
.btn-teal:hover{background:#25c98f}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
.btn-ghost:hover{border-color:var(--paper);color:var(--paper)}
.tag{font-size:.75rem;color:var(--teal);letter-spacing:.1em;text-transform:uppercase;font-family:'Space Grotesk',sans-serif;margin-bottom:1rem}
footer{text-align:center;padding:1.75rem 0;color:var(--muted);font-size:.85rem;border-top:1px solid var(--line)}
</style>
</head>
<body>
<div class="center">
  <div class="brand-mark">EV</div>
  <div class="tag">AI Visual Learning</div>
  <h1>EduVision AI</h1>
  <p>Upload a document or type your topics. Get interactive lessons with canvas diagrams, animations, videos, and simulations — all generated by AI.</p>
  <div class="actions" id="actions">
    <a href="signup.html" class="btn btn-amber">Get Started</a>
    <a href="signin.html" class="btn btn-teal">Sign In</a>
    <a href="upload.html" class="btn btn-ghost" id="dashBtn" style="display:none;">Dashboard</a>
  </div>
</div>
<footer>EduVision AI &mdash; no roles, no course structure, just the idea, seen clearly.</footer>
<script>
const user = localStorage.getItem('user');
if (user) {
  document.getElementById('dashBtn').style.display = 'inline-block';
}
</script>
</body>
</html>
