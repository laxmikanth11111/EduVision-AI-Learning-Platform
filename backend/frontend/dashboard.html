<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learner Dashboard — EduVision AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #0E1A2B;
            --paper: #F4EFE4;
            --amber: #F2A623;
            --teal: #1D9E75;
            --coral: #D85A30;
            --line: rgba(244,239,228,0.14);
            --muted: rgba(244,239,228,0.55);
            --muted-strong: rgba(244,239,228,0.72);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--ink); color: var(--paper); font-family: 'Manrope', sans-serif; min-height: 100vh; }
        h1, h2, h3, h4 { font-family: 'Space Grotesk', sans-serif; }

        nav { border-bottom: 1px solid var(--line); padding: 1rem 2rem; display: flex; align-items: center; justify-content: space-between; }
        .nav-brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: inherit; }
        .brand-mark { width: 34px; height: 34px; border-radius: 8px; background: var(--amber); display: flex; align-items: center; justify-content: center; font-weight: 700; color: var(--ink); font-family: 'Space Grotesk', sans-serif; }
        .nav-right { display: flex; align-items: center; gap: 16px; }
        .nav-user { font-size: .85rem; color: var(--muted-strong); }
        .nav-links { display: flex; align-items: center; gap: 18px; }
        .nav-links a { color: var(--muted); text-decoration: none; font-size: .86rem; font-family: 'Space Grotesk', sans-serif; transition: color .2s; }
        .nav-links a:hover { color: var(--paper); }
        .nav-links a.active { color: var(--paper); font-weight: 600; }
        .btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); padding: .5rem 1rem; border-radius: 2px; cursor: pointer; font-size: .85rem; transition: border-color .2s, color .2s; }
        .btn-ghost:hover { border-color: var(--paper); color: var(--paper); }

        .container { max-width: 960px; margin: 2.5rem auto; padding: 0 1.5rem; }
        .page-head { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.5rem; }
        .page-head h1 { font-size: 1.7rem; }
        .page-sub { font-size: .9rem; color: var(--muted); margin-top: .25rem; }

        /* Summary stat cards */
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: .8rem; margin-bottom: 2rem; }
        .stat { border: 1px solid var(--line); border-radius: 3px; padding: 1rem 1.1rem; background: rgba(244,239,228,0.02); }
        .stat .stat-value { font-family: 'Space Grotesk', sans-serif; font-size: 1.7rem; font-weight: 700; color: var(--paper); }
        .stat .stat-value.teal { color: var(--teal); }
        .stat .stat-value.amber { color: var(--amber); }
        .stat .stat-label { font-size: .74rem; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; margin-top: .3rem; }

        /* Sections */
        .section { margin-bottom: 2.25rem; }
        .section > h2 { font-size: 1.05rem; color: var(--muted-strong); border-bottom: 1px solid var(--line); padding-bottom: .55rem; margin-bottom: .9rem; display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
        .section > h2 span { font-size: .78rem; font-weight: 400; color: var(--muted); font-family: 'Manrope', sans-serif; }

        /* Recommendation summary callout */
        .reco-summary { border: 1px solid rgba(242,166,35,.4); border-left: 3px solid var(--amber); border-radius: 3px; padding: .9rem 1.1rem; margin-bottom: 1.2rem; background: rgba(242,166,35,0.05); }
        .reco-summary p { color: var(--muted-strong); font-size: .92rem; }

        /* Recommendations list */
        .reco { border: 1px solid var(--line); border-radius: 3px; padding: .95rem 1.15rem; margin-bottom: .7rem; display: flex; gap: 1rem; align-items: flex-start; background: rgba(244,239,228,0.02); }
        .reco-priority { flex-shrink: 0; font-size: .66rem; letter-spacing: .08em; text-transform: uppercase; padding: .22rem .55rem; border-radius: 999px; font-family: 'Space Grotesk', sans-serif; }
        .reco-priority.critical { background: rgba(216,90,48,0.18); color: var(--coral); }
        .reco-priority.high { background: rgba(242,166,35,0.16); color: var(--amber); }
        .reco-priority.medium { background: rgba(244,239,228,0.1); color: var(--muted-strong); }
        .reco-priority.low { background: rgba(29,158,117,0.16); color: var(--teal); }
        .reco .reco-title { font-weight: 600; color: var(--paper); font-size: .95rem; }
        .reco .reco-desc { color: var(--muted); font-size: .85rem; margin-top: .25rem; line-height: 1.55; }
        .reco .reco-reason { font-size: .76rem; color: var(--muted); margin-top: .3rem; opacity: .9; }
        .reco .reco-meta { font-size: .72rem; color: var(--amber); margin-top: .35rem; letter-spacing: .04em; }
        .reco-btn { font-size: .72rem; font-family: 'Space Grotesk', sans-serif; color: var(--amber); border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: .3rem .7rem; cursor: pointer; letter-spacing: .04em; transition: background .2s, color .2s, border-color .2s; }
        .reco-btn:hover { background: var(--amber); color: var(--ink); border-color: var(--amber); }
        .reco-btn:disabled { opacity: .5; cursor: default; }

        /* P11: Today plan / goals / learning path */
        .plan-summary { font-size: .78rem; color: var(--muted-strong); margin-top: -.35rem; margin-bottom: .85rem; }
        .plan-type { flex-shrink: 0; font-size: .64rem; letter-spacing: .08em; text-transform: uppercase; padding: .2rem .5rem; border-radius: 999px; font-family: 'Space Grotesk', sans-serif; border: 1px solid var(--line); color: var(--muted-strong); background: rgba(244,239,228,0.04); }
        .plan-type.review { border-color: rgba(242,166,35,.5); color: var(--amber); }
        .plan-type.practice { border-color: rgba(216,90,48,.5); color: var(--coral); }
        .plan-type.lesson { border-color: rgba(29,158,117,.5); color: var(--teal); }
        .goal { border: 1px solid var(--line); border-radius: 3px; padding: .8rem 1.05rem; margin-bottom: .6rem; background: rgba(244,239,228,0.02); }
        .goal .goal-top { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
        .goal .goal-name { font-weight: 500; color: var(--paper); font-size: .92rem; }
        .goal .goal-meta { font-size: .72rem; color: var(--muted); margin-top: .2rem; }
        .goal .goal-pct { font-family: 'Space Grotesk', sans-serif; font-size: .92rem; color: var(--paper); min-width: 46px; text-align: right; }
        .goal .goal-bar { width: 100%; height: 6px; border-radius: 3px; background: rgba(244,239,228,0.12); overflow: hidden; margin-top: .55rem; }
        .goal .goal-bar-fill { height: 100%; background: linear-gradient(90deg, var(--teal), var(--amber)); }
        .path-row { border: 1px solid var(--line); border-radius: 3px; padding: .7rem 1rem; margin-bottom: .5rem; display: flex; align-items: center; justify-content: space-between; gap: 1rem; background: rgba(244,239,228,0.02); }
        .path-row.current { border-color: var(--amber); background: rgba(242,166,35,0.06); }
        .path-row .path-title { font-size: .92rem; color: var(--paper); }
        .path-row .path-meta { font-size: .74rem; color: var(--muted); margin-top: .2rem; }
        .path-row .path-pos { font-size: .68rem; font-family: 'Space Grotesk', sans-serif; letter-spacing: .06em; color: var(--ink); background: var(--amber); border-radius: 999px; padding: .17rem .5rem; }

        /* Lessons */
        .lesson { border: 1px solid var(--line); border-radius: 3px; padding: .9rem 1.15rem; margin-bottom: .6rem; display: flex; align-items: center; justify-content: space-between; gap: 1rem; background: rgba(244,239,228,0.02); cursor: pointer; transition: border-color .2s; }
        .lesson:hover { border-color: var(--amber); }
        .lesson .lesson-title { font-weight: 500; color: var(--paper); font-size: .95rem; }
        .lesson .lesson-meta { font-size: .8rem; color: var(--muted); margin-top: .25rem; }
        .lesson .lesson-right { display: flex; align-items: center; gap: 1rem; flex-shrink: 0; }
        .lesson-bar { width: 110px; height: 6px; border-radius: 3px; background: rgba(244,239,228,0.12); overflow: hidden; }
        .lesson-bar-fill { height: 100%; background: linear-gradient(90deg, var(--teal), var(--amber)); }
        .lesson-pct { font-family: 'Space Grotesk', sans-serif; font-size: .9rem; color: var(--paper); min-width: 42px; text-align: right; }

        /* Concept mastery */
        .concept { border: 1px solid var(--line); border-radius: 3px; padding: .7rem 1rem; margin-bottom: .5rem; display: flex; align-items: center; justify-content: space-between; gap: 1rem; background: rgba(244,239,228,0.02); }
        .concept .concept-name { font-size: .92rem; color: var(--paper); }
        .concept .concept-score { font-family: 'Space Grotesk', sans-serif; font-size: .85rem; min-width: 48px; text-align: right; }
        .lesson-tutor { font-size: .72rem; font-family: 'Space Grotesk', sans-serif; color: var(--amber); text-decoration: none; border: 1px solid rgba(242,166,35,.5); border-radius: 999px; padding: .12rem .5rem; transition: background .2s, color .2s; }
        .lesson-tutor:hover { background: var(--amber); color: var(--ink); }
        .chip { font-size: .68rem; padding: .22rem .55rem; border-radius: 999px; border: 1px solid var(--line); font-family: 'Space Grotesk', sans-serif; letter-spacing: .04em; }
        .chip.mastered { border-color: rgba(29,158,117,.6); color: var(--teal); background: rgba(29,158,117,0.1); }
        .chip.developing { border-color: rgba(242,166,35,.6); color: var(--amber); background: rgba(242,166,35,0.1); }
        .chip.weak { border-color: rgba(216,90,48,.6); color: var(--coral); background: rgba(216,90,48,0.1); }
        .chip.new { border-color: rgba(244,239,228,.5); color: var(--muted-strong); background: rgba(244,239,228,0.04); }

        /* P13: analytics panels */
        .reco-summary strong { color: var(--paper); }
        .trend-date { font-size: .62rem; color: var(--muted); text-align: center; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .trend-arrow { font-size: .8rem; font-family: 'Space Grotesk', sans-serif; line-height: 1; }
        .trend-arrow.trend-up { color: var(--teal); }
        .trend-arrow.trend-flat { color: var(--muted-strong); }
        .trend-arrow.trend-down { color: var(--coral); }
        .delta { font-size: .72rem; font-family: 'Space Grotesk', sans-serif; letter-spacing: .03em; }
        .delta.delta-up { color: var(--teal); }
        .delta.delta-flat { color: var(--muted); }
        .delta.delta-down { color: var(--coral); }
        .effort-delta { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: .95rem; }
        .effort-delta.up { color: var(--teal); }
        .effort-delta.flat { color: var(--muted-strong); }
        .effort-delta.down { color: var(--coral); }

        /* Attempts */
        .attempt { border: 1px solid var(--line); border-radius: 3px; padding: .7rem 1rem; margin-bottom: .5rem; display: flex; align-items: center; justify-content: space-between; gap: 1rem; background: rgba(244,239,228,0.02); }
        .attempt .attempt-title { font-size: .9rem; color: var(--paper); }
        .attempt .attempt-meta { font-size: .76rem; color: var(--muted); margin-top: .2rem; }
        .attempt .attempt-score { font-family: 'Space Grotesk', sans-serif; font-size: 1.05rem; font-weight: 700; }
        .attempt .attempt-score.pass { color: var(--teal); }
        .attempt .attempt-score.fail { color: var(--coral); }

        /* Trend (simple bar chart) */
        .trend { display: flex; align-items: flex-end; gap: 10px; height: 130px; padding: .5rem .25rem 0; }
        .trend-col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: .3rem; min-width: 0; }
        .trend-bar { width: 100%; max-width: 46px; border-radius: 2px 2px 0 0; background: linear-gradient(180deg, var(--amber), var(--teal)); min-height: 2px; }
        .trend-label { font-size: .66rem; color: var(--muted); text-align: center; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .empty { color: var(--muted); font-size: .9rem; padding: .6rem 0; }
        .state-loading { text-align: center; padding: 3rem; color: var(--amber); }
        .state-error { text-align: center; padding: 2rem; color: var(--coral); }
        .state-error p { margin-bottom: 1rem; }
        footer { text-align: center; padding: 1.75rem 0; color: var(--muted); font-size: .85rem; border-top: 1px solid var(--line); margin-top: 2rem; }
    </style>
</head>
<body>
    <nav>
        <a href="/frontend/dashboard.html" class="nav-brand">
            <div class="brand-mark">EV</div>
            <span style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:1.05rem;">EduVision AI</span>
        </a>
        <div class="nav-right">
            <div class="nav-links">
                <a href="/frontend/dashboard.html" class="active">Learner Dashboard</a>
                <a href="/frontend/tutor.html">Mastery Tutor</a>
                <a href="/frontend/upload.html">Create a Deck</a>
            </div>
            <span class="nav-user" id="userName"></span>
            <button class="btn-ghost" id="logoutBtn">Sign Out</button>
        </div>
    </nav>

    <div class="container">
        <div class="page-head">
            <div>
                <h1>Learner Dashboard</h1>
                <p class="page-sub" id="pageSub">Your progress at a glance.</p>
            </div>
        </div>
        <div id="content">
            <div class="state-loading">Loading your learner progress&hellip;</div>
        </div>
    </div>

    <footer>EduVision AI &mdash; learner intelligence made simple.</footer>

    <script>
    const API = '/api/v1';
    (async function() {
        let user = JSON.parse(localStorage.getItem('user') || 'null');
        if (!user) {
            try {
                const r = await fetch(API + '/auth/refresh', { method: 'POST' });
                if (r.ok) {
                    const d = await r.json();
                    const at = d.access_token || d.data?.access_token || d.tokens?.access_token;
                    const rt = d.refresh_token || d.data?.refresh_token || d.tokens?.refresh_token;
                    if (at) {
                        localStorage.setItem('access_token', at);
                        if (rt) localStorage.setItem('refresh_token', rt);
                        const me = await fetch(API + '/auth/me', { headers: { 'Authorization': 'Bearer ' + at } });
                        if (me.ok) {
                            let u = await me.json();
                            u = u.user || u;
                            localStorage.setItem('user', JSON.stringify(u));
                            user = u;
                        }
                    }
                }
            } catch (e) { /* fall through to sign-in redirect */ }
        }
        if (!user) { window.location.href = '/frontend/signin.html'; }
        else { document.getElementById('userName').textContent = user.name || user.email; document.getElementById('pageSub').textContent = 'Hi ' + (user.name || user.email) + ' — here is your progress.'; }
        loadDashboard();
    })();

    function authHeaders() {
        const token = localStorage.getItem('access_token');
        return token ? { 'Authorization': 'Bearer ' + token } : {};
    }

    async function authFetch(url, opts = {}) {
        if (!opts.headers) opts.headers = {};
        Object.assign(opts.headers, authHeaders());
        let res = await fetch(url, opts);
        if (res.status === 401) {
            try {
                const refreshRes = await fetch(API + '/auth/refresh', { method: 'POST' });
                if (refreshRes.ok) {
                    const refreshData = await refreshRes.json();
                    const newToken = refreshData.access_token || refreshData.data?.access_token || refreshData.tokens?.access_token;
                    if (newToken) {
                        localStorage.setItem('access_token', newToken);
                        if (refreshData.refresh_token || refreshData.data?.refresh_token || refreshData.tokens?.refresh_token) {
                            localStorage.setItem('refresh_token', refreshData.refresh_token || refreshData.data?.refresh_token || refreshData.tokens?.refresh_token);
                        }
                        opts.headers['Authorization'] = 'Bearer ' + newToken;
                        res = await fetch(url, opts);
                    }
                }
            } catch (e) { /* refresh failed */ }
            if (res.status === 401) {
                window.location.href = '/frontend/signin.html';
                throw new Error('Session expired. Please sign in again.');
            }
        }
        return res;
    }

    document.getElementById('logoutBtn').addEventListener('click', async () => {
        await fetch(API + '/auth/logout', { method: 'POST', credentials: 'include' });
        localStorage.removeItem('access_token');
        localStorage.removeItem('refresh_token');
        localStorage.removeItem('user');
        window.location.href = '/frontend/signin.html';
    });

    function escHtml(s) {
        const d = document.createElement('div');
        d.textContent = (s == null ? '' : String(s));
        return d.innerHTML;
    }

    function pct(v) {
        const n = Number(v);
        return isNaN(n) ? '0' : String(Math.round(n));
    }

    async function loadDashboard() {
        const content = document.getElementById('content');
        try {
            const res = await authFetch(API + '/me/progress');
            if (!res.ok) {
                let msg = 'Failed to load progress (' + res.status + ')';
                try { const j = await res.json(); if (j.error && j.error.message) msg = j.error.message; } catch (e) {}
                throw new Error(msg);
            }
            const json = await res.json();
            const data = json.data || {};
            content.innerHTML = renderDashboard(data);
            loadReviewPanel();
            loadTodayPlanPanel();
            loadGoalsPanel();
            loadPathPanel();
            loadAnalyticsPanels();
        } catch (e) {
            content.innerHTML = '<div class="state-error"><p>Could not load your progress: ' + escHtml(e.message) + '</p>' +
                '<button class="btn-ghost" onclick="loadDashboard()">Retry</button></div>';
        }
    }

    function renderDashboard(d) {
        const s = d.summary || {};
        const parts = [];

        // Summary stats
        parts.push('<div class="stats">');
        parts.push(stat(s.lessons_completed, 'Lessons Completed', 'teal'));
        parts.push(stat(s.lessons_in_progress, 'In Progress', 'amber'));
        parts.push(stat(pct(s.average_mastery) + '%', 'Avg Mastery', ''));
        parts.push(stat(s.mastered_concepts, 'Mastered Concepts', 'teal'));
        parts.push(stat(s.developing_concepts, 'Developing', 'amber'));
        parts.push(stat(s.weak_concepts, 'Needs Review', 'amber'));
        parts.push(stat(s.attempts_total, 'Checkpoints Taken', ''));
        parts.push('</div>');

        // Today plan (P11)
        parts.push(todayPlanPanelHtml(d));

        // Recommendations
        parts.push('<div class="section"><h2>Next Best Actions<span>what to focus on next</span></h2>');
        const recoSummary = (d.recommendations_summary || '').trim();
        if (recoSummary) parts.push('<div class="reco-summary"><p>' + escHtml(recoSummary) + '</p></div>');
        const recos = d.recommendations || [];
        if (recos.length) {
            recos.forEach(r => {
                const pr = String(r.priority || 'medium').toLowerCase();
                parts.push(
                    '<div class="reco"><span class="reco-priority ' + pr + '">' + escHtml(pr) + '</span>' +
                    '<div><div class="reco-title">' + escHtml(r.title) + '</div>' +
                    (r.description ? '<div class="reco-desc">' + escHtml(r.description) + '</div>' : '') +
                    (r.reason ? '<div class="reco-reason">' + escHtml(r.reason) + '</div>' : '') +
                    recoAction(r) +
                    '</div></div>'
                );
            });
        } else {
            parts.push('<div class="empty">No recommendations yet &mdash; start a lesson to get guidance.</div>');
        }
        parts.push('</div>');

        parts.push(reviewPanelHtml(d));

        // Learning goals (P11)
        parts.push(goalsPanelHtml(d));

        // Lesson progress (dashboard → lesson navigation)
        parts.push('<div class="section"><h2>Lesson Progress<span>click a lesson to resume</span></h2>');
        const lessons = d.lesson_progress || [];
        if (lessons.length) {
            lessons.forEach(l => {
                const cp = Math.min(100, Math.max(0, Number(l.completion_percentage) || 0));
                parts.push(
                    '<div class="lesson" onclick="window.location.href=\'/frontend/player.html?lesson=' + encodeURIComponent(l.lesson_id) + '\'">' +
                    '<div><div class="lesson-title">' + escHtml(l.title) + '</div>' +
                    '<div class="lesson-meta">' + escHtml(l.status) + '</div></div>' +
                    '<div class="lesson-right"><div class="lesson-bar"><div class="lesson-bar-fill" style="width:' + cp + '%;"></div></div>' +
                    '<span class="lesson-pct">' + pct(cp) + '%</span></div></div>'
                );
            });
        } else {
            parts.push('<div class="empty">No lessons yet &mdash; create a deck to get started.</div>');
        }
        parts.push('</div>');

        // Learning path (P11)
        parts.push(pathPanelHtml(d));

        // Concepts mastery
        parts.push('<div class="section"><h2>Concept Mastery<span>weak items first</span></h2>');
        const concepts = d.concept_mastery || [];
        const order = { 'weak': 0, 'developing': 1, 'mastered': 2 };
        concepts.slice().sort((a, b) => (order[a.status] ?? 3) - (order[b.status] ?? 3)).forEach(c => {
            const isWeak = String(c.status).toLowerCase() === 'weak';
            const tutorCtl = isWeak
                ? '<a class="lesson-tutor" href="/frontend/tutor.html?concept=' + encodeURIComponent(c.concept_id || c.concept_name) + '">Ask tutor</a>'
                : '';
            parts.push(
                '<div class="concept"><div style="display:flex;align-items:center;gap:.6rem;"><span class="concept-name">' + escHtml(c.concept_name) + '</span>' + tutorCtl + '</div>' +
                '<div style="display:flex;align-items:center;gap:.7rem;"><span class="chip ' + escHtml(c.status) + '">' + escHtml(c.status) + '</span>' +
                '<span class="concept-score">' + pct(c.mastery_score) + '%</span></div></div>'
            );
        });
        if (!concepts.length) parts.push('<div class="empty">No concepts tracked yet.</div>');
        parts.push('</div>');

        // P13: analytics panels (trajectory / concepts-at-a-glance / effort)
        parts.push('<div class="section"><h2>Your Trajectory<span>accuracy over time</span></h2>' +
            '<div id="analyticsFocus"></div>' +
            '<div id="analyticsTrendBody"><div class="empty">Loading trajectory&hellip;</div></div></div>');
        parts.push('<div class="section"><h2>Concepts at a Glance<span>band + trend</span></h2>' +
            '<div id="analyticsConceptsBody"><div class="empty">Loading concepts&hellip;</div></div></div>');
        parts.push('<div class="section"><h2>Effort vs Mastery<span>does practice pay off?</span></h2>' +
            '<div id="analyticsEffortBody"><div class="empty">Loading effort&hellip;</div></div></div>');

        // P14: retention surface (recall signal + outcomes, read-only)
        parts.push('<div class="section"><h2>Retention<span>how well you remember</span></h2>' +
            '<div id="retentionBody"><div class="empty">Loading retention&hellip;</div></div></div>');

        // Recent attempts
        parts.push('<div class="section"><h2>Recent Checkpoints<span>last attempts</span></h2>');
        const attempts = d.recent_attempts || [];
        if (attempts.length) {
            attempts.forEach(a => {
                const passCls = a.passed === true ? 'pass' : (a.passed === false ? 'fail' : '');
                parts.push(
                    '<div class="attempt"><div><div class="attempt-title">' + escHtml(a.title) + '</div>' +
                    '<div class="attempt-meta">' + (a.completed_at ? escHtml(a.completed_at) : '—') + '</div></div>' +
                    '<span class="attempt-score ' + passCls + '">' + (a.percent_score != null ? pct(a.percent_score) + '%' : '—') + '</span></div>'
                );
            });
        } else {
            parts.push('<div class="empty">No checkpoints taken yet.</div>');
        }
        parts.push('</div>');

        // Trend
        parts.push('<div class="section"><h2>Recent Performance Trend<span>scores over time</span></h2>');
        const trend = d.trend || [];
        if (trend.length) {
            parts.push('<div class="trend">');
            trend.forEach(t => {
                parts.push('<div class="trend-col"><div class="trend-bar" style="height:' + Math.min(100, Math.max(2, Number(t.value) || 0)) + '%;"></div>' +
                    '<div class="trend-label">' + (t.value != null ? pct(t.value) + '%' : '—') + '</div></div>');
            });
            parts.push('</div>');
        } else {
            parts.push('<div class="empty">Not enough data to show a trend yet.</div>');
        }
        parts.push('</div>');

        return parts.join('');
    }

    function stat(value, label, cls) {
        return '<div class="stat"><div class="stat-value ' + cls + '">' + escHtml(value) + '</div>' +
            '<div class="stat-label">' + escHtml(label) + '</div></div>';
    }

    // NG-2: a dashboard recommendation must be an actionable, deep-linked CTA.
    // Returns a working link when a real destination (lesson or concept) exists;
    // otherwise '' so we never render a dead button/link.
    function recoAction(r) {
        if (!r) return '';
        if (r.lesson_id) {
            return '<div class="reco-meta"><a class="lesson-tutor" href="/frontend/player.html?lesson=' +
                encodeURIComponent(String(r.lesson_id)) + '">Open lesson</a></div>';
        }
        if (r.concept_id) {
            return '<div class="reco-meta"><a class="lesson-tutor" href="/frontend/tutor.html?concept=' +
                encodeURIComponent(String(r.concept_id)) + '">Review this concept</a></div>';
        }
        return '';
    }

    // P11 ───────────────────────────────────────────────────────────────
    // Today plan panel: deterministic day plan with deep-linkable items.
    function todayPlanPanelHtml() {
        return '<div class="section"><h2>Today\u2019s Plan<span>what to do next</span></h2>' +
            '<div id="todayPlanBody"><div class="empty">Loading today\u2019s plan&hellip;</div></div></div>';
    }

    async function loadTodayPlanPanel() {
        const body = document.getElementById('todayPlanBody');
        if (!body) return;
        try {
            const res = await authFetch(API + '/me/plan/today');
            if (!res.ok) {
                body.innerHTML = '<div class="empty">Today plan unavailable.</div>';
                return;
            }
            const json = await res.json();
            const data = json.data || {};
            const items = data.items || [];
            if (!items.length) {
                body.innerHTML = '<div class="empty">All caught up \u2014 nothing pending today.</div>';
                return;
            }
            body.innerHTML =
                (data.summary ? '<div class="plan-summary">' + escHtml(data.summary) + '</div>' : '') +
                items.map(function (it) {
                    const done = String(it.status) === 'completed';
                    const typeLabel = ({review: 'Review', practice: 'Practice', lesson: 'Lesson'})[it.item_type] || it.item_type;
                    const link = it.deep_link
                        ? '<a class="lesson-tutor" href="' + escHtml(it.deep_link) + '">Open</a>'
                        : '';
                    const btn = done
                        ? '<span class="chip mastered">done</span>'
                        : '<button type="button" class="reco-btn" data-key="' + escHtml(it.item_key) + '" onclick="completePlanItem(this)">' +
                          (it.item_type === 'review' ? 'Mark reviewed' : 'Mark complete') + '</button>';
                    return '<div class="reco"><span class="plan-type ' + escHtml(it.item_type) + '">' + typeLabel + '</span>' +
                        '<div><div class="reco-title">' + escHtml(it.title) + '</div>' +
                        '<div class="reco-reason">' + escHtml(it.reason) + '</div>' +
                        '<div class="reco-meta">' + link + ' ' + btn + '</div></div></div>';
                }).join('');
        } catch (e) {
            body.innerHTML = '<div class="empty">Today plan unavailable.</div>';
        }
    }

    // P11: complete a plan item through the real API (review items route
    // through the P10 completion loop), then refresh the panel.
    async function completePlanItem(btn) {
        const key = btn && btn.getAttribute('data-key');
        if (!key) return;
        btn.disabled = true;
        btn.textContent = 'Recording\u2026';
        try {
            const res = await authFetch(API + '/me/plan/today/items/' + encodeURIComponent(key) + '/complete', { method: 'POST' });
            if (!res.ok) throw new Error('complete ' + res.status);
            await loadTodayPlanPanel();
        } catch (err) {
            btn.disabled = false;
            btn.textContent = 'Retry';
            const body = document.getElementById('todayPlanBody');
            if (body) body.innerHTML = '<div class="empty">Could not record item: ' + escHtml(err.message) + '</div>';
        }
    }

    // Goals panel: derived progress with a mark-achieved action.
    function goalsPanelHtml() {
        return '<div class="section"><h2>Learning Goals<span>derived progress</span></h2>' +
            '<div id="goalsBody"><div class="empty">Loading goals&hellip;</div></div></div>';
    }

    async function loadGoalsPanel() {
        const body = document.getElementById('goalsBody');
        if (!body) return;
        try {
            const res = await authFetch(API + '/me/goals');
            if (!res.ok) {
                body.innerHTML = '<div class="empty">Goals unavailable.</div>';
                return;
            }
            const json = await res.json();
            const goals = (json.data && json.data.goals) || [];
            if (!goals.length) {
                body.innerHTML = '<div class="empty">No goals yet \u2014 set a target to start tracking.</div>';
                return;
            }
            body.innerHTML = goals.map(function (g) {
                const pctVal = Math.min(100, Math.max(0, Number(g.progress_percent) || 0));
                const achieved = String(g.status) === 'achieved';
                const action = achieved
                    ? '<span class="chip mastered">Achieved</span>'
                    : (pctVal >= 100
                        ? '<button type="button" class="reco-btn" data-goal="' + escHtml(g.id) + '" onclick="completeGoal(this)">Mark achieved</button>'
                        : '<span class="chip ' + (pctVal < 50 ? 'weak' : 'developing') + '">in progress</span>');
                return '<div class="goal"><div class="goal-top"><div><div class="goal-name">' + escHtml(g.title) + '</div>' +
                    '<div class="goal-meta">' + escHtml(g.goal_type.replace('_', ' ')) + (g.target_value != null ? ' \u00b7 target ' + escHtml(String(g.target_value)) : '') + '</div></div>' +
                    '<span class="goal-pct">' + pct(pctVal) + '%</span></div>' +
                    '<div class="goal-bar"><div class="goal-bar-fill" style="width:' + pctVal + '%;"></div></div>' +
                    '<div style="margin-top:.5rem;">' + action + '</div></div>';
            }).join('');
        } catch (e) {
            body.innerHTML = '<div class="empty">Goals unavailable.</div>';
        }
    }

    // P11: mark a goal achieved (server enforces the target is actually met).
    async function completeGoal(btn) {
        const goalId = btn && btn.getAttribute('data-goal');
        if (!goalId) return;
        btn.disabled = true;
        btn.textContent = 'Recording\u2026';
        try {
            const res = await authFetch(API + '/me/goals/' + encodeURIComponent(goalId) + '/complete', { method: 'POST' });
            if (!res.ok) {
                let msg = 'complete ' + res.status;
                try { const j = await res.json(); if (j.error && j.error.message) msg = j.error.message; } catch (e2) {}
                throw new Error(msg);
            }
            await loadGoalsPanel();
        } catch (err) {
            btn.disabled = false;
            btn.textContent = 'Mark achieved';
            const body = document.getElementById('goalsBody');
            if (body) body.innerHTML = '<div class="empty">Could not complete goal: ' + escHtml(err.message) + '</div>';
        }
    }

    // Learning-path panel: the ordered path with the current lesson marked.
    function pathPanelHtml() {
        return '<div class="section"><h2>Learning Path<span>weakest first</span></h2>' +
            '<div id="pathBody"><div class="empty">Loading learning path&hellip;</div></div></div>';
    }

    async function loadPathPanel() {
        const body = document.getElementById('pathBody');
        if (!body) return;
        try {
            const res = await authFetch(API + '/me/path');
            if (!res.ok) {
                body.innerHTML = '<div class="empty">Learning path unavailable.</div>';
                return;
            }
            const json = await res.json();
            const data = json.data || {};
            const seq = data.sequence || [];
            if (!seq.length) {
                body.innerHTML = '<div class="empty">No lessons yet \u2014 create a deck to start your path.</div>';
                return;
            }
            const pos = Number(data.position) || 0;
            body.innerHTML = '<div class="plan-summary">' + pct(data.progress_percent) + '% complete \u00b7 ' + seq.length + ' lessons</div>' +
                seq.map(function (s, i) {
                    const isCurrent = (i + 1) === pos;
                    const statusCls = s.status === 'completed' ? 'mastered' : (isCurrent ? 'developing' : '');
                    return '<div class="path-row' + (isCurrent ? ' current' : '') + '">' +
                        '<div><div class="path-title">' + escHtml(s.title) + '</div>' +
                        '<div class="path-meta">' + escHtml(s.status) + (isCurrent ? ' \u00b7 up next' : '') + '</div></div>' +
                        '<div style="display:flex;align-items:center;gap:.6rem;">' +
                        '<span class="chip ' + statusCls + '">' + pct(s.completion_percentage) + '%</span>' +
                        '<a class="lesson-tutor" href="/frontend/player.html?lesson=' + encodeURIComponent(s.lesson_id) + '">Open</a></div></div>';
                }).join('');
        } catch (e) {
            body.innerHTML = '<div class="empty">Learning path unavailable.</div>';
        }
    }

    function reviewPanelHtml() {
        return '<div class="section"><h2>Review Queue<span>spaced repetition</span></h2>' +
            '<div id="reviewPanelBody"><div class="empty">Loading review queue&hellip;</div></div></div>';
    }

    async function loadReviewPanel() {
        const body = document.getElementById('reviewPanelBody');
        if (!body) return;
        try {
            const res = await authFetch(API + '/me/review?limit=20');
            if (!res.ok) {
                body.innerHTML = '<div class="empty">Review queue unavailable.</div>';
                return;
            }
            const json = await res.json();
            const data = json.data || {};
            const items = data.items || [];
            if (!items.length) {
                body.innerHTML = '<div class="empty">Nothing due for review &mdash; keep practising to stay sharp.</div>';
                return;
            }
            const parts = items.map(function (it) {
                const pr = String(it.priority || 'medium').toLowerCase();
                const due = it.due_at ? it.due_at.replace('T', ' ').slice(0, 16) + ' UTC' : 'due now';
                const lessonId = it.lesson_id ? encodeURIComponent(String(it.lesson_id)) : '';
                const practice = lessonId
                    ? '<a class="lesson-tutor" href="/frontend/player.html?lesson=' + lessonId + '">Practice</a>'
                    : '';
                const statusChip = it.retention_status
                    ? '<span class="chip ' + ({ on_track: 'mastered', at_risk: 'developing', overdue: 'weak', new: 'new' })[it.retention_status] + '">' + escHtml(it.retention_status) + '</span>'
                    : '';
                const accuracy = it.review_accuracy != null
                    ? ' <span class="delta delta-flat">' + pct(it.review_accuracy) + '% recalled</span>'
                    : '';
                // P14: outcome buttons — "Mark reviewed" (good, the default /
                // legacy path) FIRST, then Again/Hard/Easy for self-reported
                // recall. The first .reco-btn stays the good/default action.
                const outcomeButtons =
                    ' <button type="button" class="reco-btn" data-schedule="' + escHtml(String(it.schedule_id || '')) + '" data-outcome="good" onclick="completeReview(this)">Mark reviewed</button>' +
                    '<button type="button" class="reco-btn" data-schedule="' + escHtml(String(it.schedule_id || '')) + '" data-outcome="again" onclick="completeReview(this)">Again</button>' +
                    '<button type="button" class="reco-btn" data-schedule="' + escHtml(String(it.schedule_id || '')) + '" data-outcome="hard" onclick="completeReview(this)">Hard</button>' +
                    '<button type="button" class="reco-btn" data-schedule="' + escHtml(String(it.schedule_id || '')) + '" data-outcome="easy" onclick="completeReview(this)">Easy</button>';
                const actions = '<div class="reco-meta">' +
                    (practice ? practice : '') + outcomeButtons +
                    '</div>';
                return '<div class="reco"><span class="reco-priority ' + pr + '">' + escHtml(it.priority || 'due') + '</span>' +
                    '<div><div class="reco-title">' + escHtml(it.concept_name || it.topic || 'Concept') + '</div>' +
                    '<div class="reco-reason">due: ' + escHtml(due) + ' ' + statusChip + accuracy + '</div>' +
                    actions +
                    '</div></div>';
            });
            body.innerHTML = parts.join('');
        } catch (e) {
            body.innerHTML = '<div class="empty">Review queue unavailable.</div>';
        }
    }

    // P10 + P14: complete a due review through the real API, then refresh the
    // panel so the interval/due state visibly advances. The outcome comes from
    // the button (good by default/legacy) — again/hard/easy move the interval
    // ladder accordingly.
    async function completeReview(btn) {
        const scheduleId = btn && btn.getAttribute('data-schedule');
        if (!scheduleId) return;
        const outcome = (btn.getAttribute('data-outcome') || 'good');
        btn.disabled = true;
        btn.textContent = 'Recording\u2026';
        try {
            const res = await authFetch(API + '/me/review/' + encodeURIComponent(scheduleId) + '/complete', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ outcome: outcome })
            });
            if (!res.ok) throw new Error('complete ' + res.status);
            await loadReviewPanel();
        } catch (err) {
            btn.disabled = false;
            btn.textContent = outcome === 'good' ? 'Mark reviewed' : outcome.charAt(0).toUpperCase() + outcome.slice(1);
            const body = document.getElementById('reviewPanelBody');
            if (body) body.innerHTML = '<div class="empty">Could not record review: ' + escHtml(err.message) + '</div>';
        }
    }

    // P13 ───────────────────────────────────────────────────────────────
    // Mastery-analytics panels fed by the (read-only, learner-scoped)
    // /me/analytics/* endpoints. Every deep-link is built server-side, so the
    // dashboard never renders a dead button. All injection is escaped.
    async function loadAnalyticsPanels() {
        await Promise.all([
            loadAnalyticsTrajectory(),
            loadAnalyticsConcepts(),
            loadAnalyticsEffort(),
            loadRetentionPanel()
        ]);
    }

    // "Your trajectory" — bar chart from /trend plus a current-focus callout
    // from /overview so the insight resolves to an actionable next step.
    async function loadAnalyticsTrajectory() {
        const trendBody = document.getElementById('analyticsTrendBody');
        if (!trendBody) return;
        try {
            const res = await authFetch(API + '/me/analytics/trend');
            if (!res.ok) {
                trendBody.innerHTML = '<div class="empty">Trajectory unavailable (' + escHtml(String(res.status)) + ').</div>';
                return;
            }
            const data = (await res.json()).data || {};
            const points = data.points || [];
            const focusEl = document.getElementById('analyticsFocus');
            try {
                const oRes = await authFetch(API + '/me/analytics/overview');
                if (oRes.ok) {
                    const o = (await oRes.json()).data || {};
                    const f = o.current_focus;
                    if (f && focusEl) {
                        const cta = f.deep_link
                            ? ' <a class="lesson-tutor" href="' + escHtml(f.deep_link) + '">Focus here</a>'
                            : '';
                        focusEl.innerHTML = '<div class="reco-summary"><p><strong>Focus:</strong> ' + escHtml(f.name) +
                            ' &mdash; ' + escHtml(f.band) + ' band.' + cta + '</p></div>';
                    }
                }
            } catch (e) { /* focus callout is optional */ }
            if (!points.length) {
                trendBody.innerHTML = '<div class="empty">No checkpoints yet &mdash; take a checkpoint to start seeing your trajectory.</div>';
                return;
            }
            trendBody.innerHTML = '<div class="trend">' + points.map(function (p) {
                const bar = Math.min(100, Math.max(2, Number(p.percent) || 0));
                return '<div class="trend-col"><div class="trend-bar" style="height:' + bar + '%;"></div>' +
                    '<div class="trend-label">' + (p.percent != null ? pct(p.percent) + '%' : '&mdash;') + '</div>' +
                    '<div class="trend-date">' + escHtml(String(p.date).slice(0, 10)) + '</div></div>';
            }).join('') + '</div>';
        } catch (e) {
            trendBody.innerHTML = '<div class="empty">Trajectory unavailable: ' + escHtml(e.message) + '</div>';
        }
    }

    // "Concepts at a glance" — band chip, trend arrow, mastery delta and the
    // server-built Practice / Ask-tutor deep-links.
    async function loadAnalyticsConcepts() {
        const body = document.getElementById('analyticsConceptsBody');
        if (!body) return;
        try {
            const res = await authFetch(API + '/me/analytics/concepts');
            if (!res.ok) {
                body.innerHTML = '<div class="empty">Concepts unavailable.</div>';
                return;
            }
            const data = (await res.json()).data || {};
            const concepts = data.concepts || [];
            if (!concepts.length) {
                body.innerHTML = '<div class="empty">No concepts tracked yet \u2014 complete a lesson to get started.</div>';
                return;
            }
            body.innerHTML = concepts.map(function (c) {
                const arrow = c.trend === 'up' ? '&#9650;' : (c.trend === 'down' ? '&#9660;' : '&#9654;');
                const delta = c.delta_mastery != null
                    ? '<span class="delta delta-' + escHtml(c.trend) + '">' + (c.delta_mastery > 0 ? '+' : '') + pct(c.delta_mastery) + '</span>'
                    : '<span class="delta delta-flat">n/a</span>';
                const links = (c.deep_link_practice
                    ? '<a class="lesson-tutor" href="' + escHtml(c.deep_link_practice) + '">Practice</a>'
                    : '') +
                    (c.deep_link_tutor
                    ? ' <a class="lesson-tutor" href="' + escHtml(c.deep_link_tutor) + '">Ask tutor</a>'
                    : '');
                return '<div class="concept"><div style="display:flex;align-items:center;gap:.6rem;">' +
                    '<span class="concept-name">' + escHtml(c.name) + '</span>' +
                    '<span class="trend-arrow trend-' + escHtml(c.trend) + '">' + arrow + '</span>' + delta + '</div>' +
                    '<div style="display:flex;align-items:center;gap:.7rem;">' +
                    '<span class="chip ' + escHtml(c.band) + '">' + escHtml(c.band) + '</span>' +
                    '<span class="concept-score">' + pct(c.current_mastery) + '%</span>' +
                    (links ? '<div class="reco-meta">' + links + '</div>' : '') + '</div></div>';
            }).join('');
        } catch (e) {
            body.innerHTML = '<div class="empty">Concepts unavailable: ' + escHtml(e.message) + '</div>';
        }
    }

    // "Effort vs mastery" — attempts/sessions/minutes spent vs mastery gained.
    async function loadAnalyticsEffort() {
        const body = document.getElementById('analyticsEffortBody');
        if (!body) return;
        try {
            const res = await authFetch(API + '/me/analytics/effort');
            if (!res.ok) {
                body.innerHTML = '<div class="empty">Effort unavailable.</div>';
                return;
            }
            const data = (await res.json()).data || {};
            const effort = data.effort || [];
            if (!effort.length) {
                body.innerHTML = '<div class="empty">No checkpoint effort yet \u2014 take a checkpoint to see what your work is yielding.</div>';
                return;
            }
            body.innerHTML = effort.map(function (e) {
                const delta = e.mastery_delta != null
                    ? '<span class="effort-delta ' + (e.mastery_delta > 0 ? 'up' : (e.mastery_delta < 0 ? 'down' : 'flat')) + '">' +
                      (e.mastery_delta > 0 ? '+' : '') + pct(e.mastery_delta) + ' mastery</span>'
                    : '<span class="effort-delta flat">no movement yet</span>';
                const minutes = Math.round((Number(e.time_seconds) || 0) / 60);
                const perEffort = e.efficiency != null ? ' &middot; ' + pct(e.efficiency) + ' pts/attempt' : '';
                return '<div class="reco"><span class="plan-type practice">effort</span>' +
                    '<div><div class="reco-title">' + escHtml(e.name) + '</div>' +
                    '<div class="reco-reason">' + e.attempts + ' attempt' + (e.attempts === 1 ? '' : 's') + ' &middot; ' +
                    e.sessions + ' session' + (e.sessions === 1 ? '' : 's') + ' &middot; ' + minutes + ' min' + perEffort + '</div>' +
                    '<div class="reco-meta">' + delta + '</div></div></div>';
            }).join('');
        } catch (e) {
            body.innerHTML = '<div class="empty">Effort unavailable: ' + escHtml(e.message) + '</div>';
        }
    }

    // P14 ───────────────────────────────────────────────────────────────
    // "Retention" — recall signal per concept (overdue-first), fed by the
    // read-only /me/analytics/retention endpoint. Statuses map onto the shared
    // chip vocabulary; strengths are honest (never fabricated for 'new').
    async function loadRetentionPanel() {
        const body = document.getElementById('retentionBody');
        if (!body) return;
        try {
            const res = await authFetch(API + '/me/analytics/retention');
            if (!res.ok) {
                body.innerHTML = '<div class="empty">Retention unavailable (' + escHtml(String(res.status)) + ').</div>';
                return;
            }
            const data = (await res.json()).data || {};
            const summary = data.summary || {};
            const concepts = data.concepts || [];
            const statusChip = { on_track: 'mastered', at_risk: 'developing', overdue: 'weak', new: 'new' };
            let html = '<div class="stats">' +
                stat(summary.retention_average != null ? pct(summary.retention_average) + '%' : '\u2014', 'Retention Avg', '') +
                stat(summary.on_track_count, 'On Track', 'teal') +
                stat(summary.at_risk_count, 'At Risk', 'amber') +
                stat(summary.overdue_count, 'Overdue', 'amber') +
                stat(summary.new_count, 'New', '') +
                '</div>';
            if (!concepts.length) {
                body.innerHTML = html + '<div class="empty">No retention signals yet \u2014 review a concept to start tracking recall.</div>';
                return;
            }
            html += concepts.map(function (c) {
                const chip = statusChip[c.status] || 'new';
                const strength = c.retained_strength != null ? pct(c.retained_strength) + '%' : '\u2014';
                const accuracy = c.review_accuracy != null ? ' \u00b7 ' + pct(c.review_accuracy) + '% recalled' : '';
                const reviewed = c.days_since_review != null
                    ? Math.round(c.days_since_review) + 'd since review'
                    : 'never reviewed';
                const links = (c.deep_link_practice
                    ? '<a class="lesson-tutor" href="' + escHtml(c.deep_link_practice) + '">Practice</a>'
                    : '') +
                    (c.deep_link_tutor
                    ? ' <a class="lesson-tutor" href="' + escHtml(c.deep_link_tutor) + '">Ask tutor</a>'
                    : '');
                return '<div class="reco"><span class="chip ' + chip + '">' + escHtml(c.status) + '</span>' +
                    '<div><div class="reco-title">' + escHtml(c.name) + '</div>' +
                    '<div class="reco-reason">' + escHtml(reviewed) + accuracy + '</div>' +
                    '<div class="reco-meta">' + links + '</div></div>' +
                    '<span class="concept-score">' + escHtml(strength) + '</span></div>';
            }).join('');
            body.innerHTML = html;
        } catch (e) {
            body.innerHTML = '<div class="empty">Retention unavailable: ' + escHtml(e.message) + '</div>';
        }
    }
    </script>
</body>
</html>
