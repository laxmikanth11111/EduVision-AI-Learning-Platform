name: CI

on:
  push:
    branches: [main, master, "feature/**"]
    paths:
      - "backend/**"
      - "docker-compose.yml"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "backend/**"
      - "docker-compose.yml"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

jobs:
  lint:
    name: Ruff lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: ruff check (non-mutating)
        run: ruff check app tests scripts --no-fix

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      DATABASE_URL: "sqlite+aiosqlite:///test.db"
      REDIS_URL: "redis://localhost:6379/0"
      STORAGE_PROVIDER: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run unit tests
        run: pytest tests/unit --no-header -q --tb=short

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      DATABASE_URL: "sqlite+aiosqlite:///test.db"
      REDIS_URL: "redis://localhost:6379/0"
      STORAGE_PROVIDER: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run integration tests
        # The test harness currently runs on SQLite (see tests/conftest.py);
        # PostgreSQL-backed runs are a follow-up.
        run: pytest tests/integration --no-header -q --tb=short

  migration-check:
    name: Alembic migration integrity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: eduvision
          POSTGRES_PASSWORD: eduvision
          POSTGRES_DB: eduvision
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eduvision"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Verify single migration head
        run: |
          heads=$(alembic heads --verbose | grep -c '\((head)\)')
          echo "heads=$heads"
          if [ "$heads" -ne 1 ]; then
            echo "Expected exactly one migration head; found $heads."
            exit 1
          fi
      - name: Live upgrade path against PostgreSQL
        run: alembic upgrade head
        env:
          APP_ENV: test
          DATABASE_URL: postgresql+asyncpg://eduvision:eduvision@localhost:5432/eduvision

  postgres-tests:
    name: PostgreSQL-backed tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      STORAGE_PROVIDER: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run PostgreSQL-backed test suite
        # tests/postgres/conftest.py creates a scratch database, migrates it
        # to the Alembic head, and drops it after the run. testcontainers is
        # preferred on CI; TEST_DATABASE_URL is a fallback.
        run: pytest tests/postgres -m postgres --no-header -q --tb=short
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/postgres

  secret-scan:
    name: Secret scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan working tree and full history for high-signal secrets
        shell: bash
        run: |
          cat > /tmp/secret-patterns.txt <<'EOF'
          AIza[0-9A-Za-z_-]{30,}
          GOCSPX[0-9A-Za-z_-]{20,}
          AKIA[0-9A-Z]{16}
          ghp_[0-9A-Za-z]{30,}
          github_pat_[0-9A-Za-z_]{40,}
          github_oauth_[0-9A-Za-z]{30,}
          xox[baprs]-[0-9A-Za-z-]{10,}
          -----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----
          sk-[0-9A-Za-z]{20,}
          EOF
          set -o pipefail
          echo "== scanning current tree =="
          if rg -N -f /tmp/secret-patterns.txt . --glob '!**/docs/**' --glob '!**/scripts/**' --glob '!**/tests/**' --glob '!*.lock'; then
            echo "HIGH-SIGNAL SECRET PATTERNS FOUND IN WORKING TREE"
            exit 1
          else
            echo "working tree: clean"
          fi
          echo "== scanning full git history =="
          if git log --all -p -- . 2>/dev/null | rg -N -f /tmp/secret-patterns.txt; then
            echo "HIGH-SIGNAL SECRET PATTERNS FOUND IN HISTORY"
            exit 1
          else
            echo "git history: clean"
          fi

  mypy-gate:
    name: mypy no-regression gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Enforce mypy error budget (baseline 86, no growth)
        # Pre-existing baseline from Phase 0/1 audit. New code must not push the
        # count above it; the value is deliberately explicit so CI cannot drift.
        run: |
          set -o pipefail
          output=$(mypy app 2>&1)
          count=$(printf '%s\n' "$output" | grep -c 'error:' || true)
          echo "mypy errors: $count"
          if [ "$count" -gt 86 ]; then
            printf '%s\n' "$output" | tail -n 40
            echo "mypy error count ($count) exceeds baseline (86)."
            exit 1
          fi

  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t eduvision-backend:ci -f backend/Dockerfile backend